<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#081827;color:#eaf7ff;font:14px system-ui}button{background:#14354c;border:1px solid #37627d;color:#eaf7ff;border-radius:8px;padding:8px 10px;cursor:pointer}button:hover,button.active{border-color:#43d9ff;background:#20556b}button:focus-visible{outline:2px solid #ffc867}.toolbar{display:flex;gap:6px;flex-wrap:wrap;padding:10px}#stage{height:490px;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#1c354b,#081827)}canvas{display:block;touch-action:none}#labels{position:absolute;inset:0;pointer-events:none}.tag{position:absolute;pointer-events:auto;padding:4px 7px;font-size:11px;white-space:nowrap;background:#081827e8;transform:translate(-50%,-50%)}#tip{position:absolute;left:12px;bottom:12px;max-width:380px;padding:12px;background:#06111df2;border:1px solid #43d9ff;border-radius:10px;pointer-events:none;display:none;line-height:1.5}#tip b{color:#43d9ff;display:block}#status{padding:8px 12px;color:#a8c5d8;font-size:12px}#topics{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px}#topics button{text-align:left;font-size:12px;padding:7px}#topics span{color:#5ee5aa;margin-right:6px}#loading{position:absolute;inset:40% 12px auto;text-align:center;color:#b7d3e5} @media(max-width:600px){#topics{grid-template-columns:repeat(2,1fr)}#stage{height:420px}.tag{font-size:10px}}
html:fullscreen{height:100%;background:#081827}html:fullscreen body{height:100vh;display:flex;flex-direction:column;overflow:hidden}html:fullscreen #stage{flex:1;min-height:0;height:auto}html:fullscreen #topics{grid-template-columns:repeat(5,1fr);max-height:130px;overflow:auto;flex-shrink:0}html:fullscreen .toolbar{flex-shrink:0}html:fullscreen #status{flex-shrink:0}
</style></head><body><div class="toolbar"><button id="reset">↺ Full setup</button><button id="focus">Focus selected part</button><button id="labelsToggle">Labels: on</button><button id="fullscreen">Full screen</button></div><div id="stage"><div id="loading">Loading your server model…</div><div id="labels"></div><div id="tip"></div></div><div id="status">Drag to rotate · Right-drag to pan · Scroll or pinch to zoom</div><div id="topics" aria-label="All lesson topics"></div><script type="module" src="./viewer.mjs"></script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Leaf Machine - Class 6 (single file)</title>
<style>
:root{
  --ink:#12142a; --ink2:#3a3f66; --paper:#fdf7ea; --paper2:#f3e9d4;
  --red:#e03131; --yellow:#ffd43b; --blue:#1c7ed6;
  --green:#2f9e44; --purple:#7048e8; --line:#12142a;
  --shadow:7px 7px 0 var(--line);
  --shadow-sm:4px 4px 0 var(--line);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  background-color:#0d1226;
  background-image:
    radial-gradient(circle at 50% 32%, rgba(47,158,68,.22), transparent 46%),
    radial-gradient(circle at 12% 88%, rgba(28,126,214,.24), transparent 42%),
    radial-gradient(circle at 88% 10%, rgba(255,212,59,.18), transparent 44%),
    repeating-conic-gradient(from 0deg at 50% 32%,
      rgba(255,255,255,.035) 0deg 5deg, rgba(255,255,255,0) 5deg 11deg),
    radial-gradient(rgba(255,255,255,.055) 1.5px, transparent 1.6px);
  background-size:auto,auto,auto,auto,20px 20px;
  background-attachment:fixed;
}
.wrap{max-width:1280px;margin:0 auto;padding:26px 20px 70px}

.panel{
  background:var(--paper);
  border:5px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:30px 32px;
  min-height:78vh;
  display:flex;
  flex-direction:column;
}
h1,h2,h3{margin:0 0 10px;line-height:1.1;letter-spacing:.5px}
h1{font-size:clamp(28px,4.4vw,46px);text-transform:uppercase}
h2{font-size:clamp(20px,3vw,30px);text-transform:uppercase}
h3{font-size:clamp(17px,2.2vw,22px);text-transform:uppercase}
p{line-height:1.55;font-size:17px}
.big{font-size:20px}
.muted{color:var(--ink2)}
.warn{color:var(--red);font-weight:bold;min-height:22px;margin:10px 0 0}
.okline{color:var(--green);font-weight:bold;min-height:22px;margin:10px 0 0}

.btn{
  font:inherit;font-weight:bold;font-size:18px;
  padding:13px 24px;border:4px solid var(--line);border-radius:12px;
  background:var(--yellow);color:var(--ink);cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:transform .06s ease, box-shadow .06s ease;
}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--line)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:var(--shadow-sm)}
.btn.go{background:var(--green);color:#fff}
.btn.hot{background:var(--red);color:#fff}
.btn.cool{background:var(--blue);color:#fff}
.btn.plain{background:var(--paper2)}
.btn.sm{font-size:15px;padding:9px 15px;border-width:3px}

label{display:block;font-weight:bold;margin:14px 0 6px;font-size:16px}
input[type=text],textarea{
  width:100%;font:inherit;font-size:17px;padding:12px 14px;
  border:3px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
}
input:focus,textarea:focus{outline:4px solid var(--yellow);outline-offset:1px}

.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.grow{flex:1 1 220px}
.navrow{display:flex;gap:12px;justify-content:space-between;margin-top:auto;padding-top:26px;flex-wrap:wrap}

/* ---------- welcome ---------- */
.hero-title{text-align:center;padding:10px 0 16px}
.kicker{
  display:inline-block;background:var(--red);color:#fff;font-weight:bold;
  padding:7px 16px;border:3px solid var(--line);border-radius:8px;
  transform:rotate(-2deg);text-transform:uppercase;letter-spacing:1px;font-size:14px;
}
.title-main{
  font-size:clamp(34px,7vw,72px);font-weight:bold;text-transform:uppercase;
  letter-spacing:1px;line-height:.98;margin:16px 0 8px;
  color:var(--yellow);
  -webkit-text-stroke:3px var(--line);
  paint-order:stroke fill;
  text-shadow:6px 6px 0 var(--green);
}
.subtitle{font-size:clamp(16px,2.4vw,23px);font-weight:bold;color:var(--ink2);text-transform:uppercase}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:22px 0}
.step{background:var(--paper2);border:3px solid var(--line);border-radius:12px;padding:16px}
.step p{margin:6px 0 0;font-size:15px}
.step .n{
  /* flex, not inline-flex: the heading must drop onto its own line below */
  display:flex;width:36px;height:36px;align-items:center;justify-content:center;
  background:var(--blue);color:#fff;border:3px solid var(--line);border-radius:50%;
  font-weight:bold;margin-bottom:10px;
}

/* ---------- story stage ---------- */
.stage{
  position:relative;width:100%;aspect-ratio:16/9;
  background:#0b0d1c;border:5px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene{opacity:0;transition:opacity .4s ease;pointer-events:none}
.scene.live{opacity:1}
.caption{
  position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(to top,rgba(8,10,22,.94),rgba(8,10,22,.7) 72%,transparent);
  color:#fff;padding:30px 20px 16px;font-size:clamp(15px,2.25vw,23px);
  font-weight:bold;text-align:center;line-height:1.35;min-height:64px;
  text-shadow:0 2px 6px #000;
}
.controls{
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  margin-top:14px;background:var(--paper2);border:4px solid var(--line);
  border-radius:12px;padding:12px 14px;
}
.bar{
  flex:1 1 200px;height:16px;background:#fff;
  border:3px solid var(--line);border-radius:10px;overflow:hidden;min-width:140px;
}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .3s linear}
.time{font-weight:bold;font-variant-numeric:tabular-nums;font-size:16px}

/* ---------- round intro ---------- */
.partbadge{
  align-self:flex-start;background:var(--purple);color:#fff;font-weight:bold;
  padding:7px 16px;border:3px solid var(--line);border-radius:9px;
  text-transform:uppercase;letter-spacing:1px;font-size:14px;margin-bottom:12px;
}
.parttitle{font-size:clamp(32px,6vw,60px);color:var(--red);-webkit-text-stroke:2px var(--line);paint-order:stroke fill}
.demo{margin:20px 0;padding:18px;background:var(--paper2);border:3px dashed var(--line);border-radius:14px}
.democap{margin:0 0 14px;font-weight:bold;font-size:16px;color:var(--ink2)}

/* ---------- quiz chrome ---------- */
.qhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.partchip{
  background:var(--purple);color:#fff;font-weight:bold;font-size:13px;
  padding:6px 13px;border:3px solid var(--line);border-radius:8px;
  text-transform:uppercase;letter-spacing:.6px;
}
.qdots{display:flex;gap:6px;flex-wrap:wrap}
.qdot{
  width:30px;height:30px;border:3px solid var(--line);border-radius:8px;
  background:var(--paper2);font-weight:bold;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;color:var(--ink);
}
.qdot.done{background:var(--green);color:#fff}
.qdot.part{background:var(--yellow)}
.qdot.here{outline:3px solid var(--red);outline-offset:2px}
.qtag{
  align-self:flex-start;
  background:var(--yellow);font-weight:bold;font-size:14px;
  padding:5px 13px;border:3px solid var(--line);border-radius:8px;letter-spacing:.6px;
}
.qtext{font-size:clamp(19px,2.5vw,27px);font-weight:bold;margin:12px 0 18px;line-height:1.3}
.qnote{font-size:16px;color:var(--ink2);margin:-8px 0 18px;font-weight:bold}

/* ---------- round 1: the sixty-four dots ---------- */
.drawwrap{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;margin-bottom:10px}
.screenbox{
  background:#14261a;border:6px solid var(--line);border-radius:14px;padding:14px;
  box-shadow:var(--shadow-sm);
}
.pxgrid{
  display:grid;grid-template-columns:repeat(8,1fr);gap:4px;
  width:min(376px,74vw);touch-action:none;user-select:none;
}
.pxcell{
  aspect-ratio:1;border:0;padding:0;margin:0;border-radius:5px;cursor:pointer;
  background:#20402a;box-shadow:inset 0 0 0 2px #0d1a11;
}
.pxcell.on{background:#5ee27a;box-shadow:inset 0 0 0 2px #0d1a11, 0 0 9px rgba(94,226,122,.75)}
.pxcell.ghost{background:#2c5c3a;box-shadow:inset 0 0 0 2px #0d1a11}
.pxcell.wrong{outline:3px solid var(--red);outline-offset:-3px}
.drawside{flex:1 1 300px;min-width:280px}
.drawtools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.countline{font-size:17px;font-weight:bold;margin:0 0 12px}
.machineface{
  background:#8a8f9e;border:5px solid var(--line);border-radius:16px;
  padding:12px;display:inline-block;box-shadow:var(--shadow-sm);
}
.machineeye{
  width:54px;height:54px;border-radius:50%;background:#1c7ed6;border:4px solid var(--line);
  margin:0 auto 10px;box-shadow:inset 0 0 0 8px #d0ebff;
}

/* ---------- round 2: the picture word ---------- */
.rebus{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 22px}
.pic{
  background:#fff;border:4px solid var(--line);border-radius:14px;
  width:118px;height:118px;padding:8px;box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.pic svg{width:100%;height:100%;display:block}
.pic .pn{
  position:absolute;left:-3px;top:-11px;background:var(--blue);color:#fff;
  border:3px solid var(--line);border-radius:50%;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;
}
.pic .named{
  position:absolute;left:0;right:0;bottom:-2px;text-align:center;
  font-size:13px;font-weight:bold;color:var(--red);text-transform:uppercase;letter-spacing:.5px;
}
.blanks{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 20px}
.blank{
  width:52px;height:64px;border:4px solid var(--line);border-bottom-width:9px;
  border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:bold;
}
.blank.got{background:var(--green);color:#fff}
.blank.shown{background:var(--yellow)}
.guessrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.guessrow input{flex:1 1 260px;font-size:22px;font-weight:bold;text-transform:uppercase;letter-spacing:3px}
.gotit{font-size:21px;font-weight:bold;color:var(--green)}

/* ---------- round 3: say it ---------- */
.micpanel{
  background:var(--paper2);border:4px solid var(--line);border-radius:14px;
  padding:20px;margin-bottom:16px;
}
.micbtn{
  font:inherit;font-weight:bold;font-size:19px;padding:16px 26px;
  border:4px solid var(--line);border-radius:14px;cursor:pointer;
  background:var(--red);color:#fff;box-shadow:var(--shadow-sm);
  display:inline-flex;align-items:center;gap:12px;
}
.micbtn.live{background:var(--green);animation:micpulse 1.1s ease-in-out infinite}
.micbtn:disabled{opacity:.45;cursor:not-allowed}
@keyframes micpulse{0%,100%{box-shadow:var(--shadow-sm)}50%{box-shadow:4px 4px 0 var(--line),0 0 0 10px rgba(47,158,68,.28)}}
.micdot{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--line)}
.heard{
  margin-top:16px;background:#fff;border:3px dashed var(--line);border-radius:12px;
  padding:14px 16px;font-size:19px;font-weight:bold;min-height:56px;
}
.heard .lab{display:block;font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}
.heard .txt{color:var(--blue)}
.heard .txt.no{color:var(--red)}
.typefall{margin-top:16px;padding-top:16px;border-top:3px dashed var(--line)}

/* ---------- result ---------- */
.scorebox{
  text-align:center;background:var(--yellow);border:5px solid var(--line);
  border-radius:16px;padding:22px;box-shadow:var(--shadow-sm);margin-bottom:16px;
}
.scorebox .num{font-size:clamp(42px,9vw,76px);font-weight:bold;line-height:1}
.partscores{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:22px}
.ps{
  background:var(--paper2);border:3px solid var(--line);border-radius:12px;
  padding:13px 16px;display:flex;justify-content:space-between;align-items:center;font-size:17px;
}
.ps span{font-weight:bold;font-size:21px}
.revhead{
  margin:18px 0 8px;font-size:19px;text-transform:uppercase;color:var(--purple);
  border-bottom:3px solid var(--line);padding-bottom:5px;
}
.review{display:flex;flex-direction:column;gap:10px}
.rev{
  border:3px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;
  display:flex;gap:12px;align-items:flex-start;font-size:16px;
}
.rev.ok{background:#ebfbee} .rev.no{background:#fff0f0} .rev.half{background:#fff9db}
.rev .mark{font-weight:bold;font-size:20px;flex:0 0 auto;width:34px;text-align:center}
.rev b{display:block;margin-bottom:3px}
.rev .said{color:var(--ink2);font-size:15px;display:block}
.revgrid{display:flex;gap:8px;margin-top:8px}
.minigrid{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;width:80px;background:var(--line);border:2px solid var(--line);border-radius:4px}
.minigrid i{aspect-ratio:1;background:#eee;display:block}
.minigrid i.on{background:var(--ink)}
.minilab{font-size:12px;font-weight:bold;color:var(--ink2);text-transform:uppercase}

@media print{
  body{background:#fff}
  .noprint{display:none !important}
  .panel{box-shadow:none;min-height:0;break-inside:avoid;border-width:3px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* scenes.js - the narrated story "The Leaf Machine".

   Every scene is one <svg class="scene"> stacked inside the stage; app.js turns
   exactly one of them "live" at a time. Pure SVG + CSS. No image files.

   FOUR RULES if you touch anything in here.

     1. Never put an animation class on a <g> that also carries a transform
        attribute. A CSS transform REPLACES the attribute and the artwork snaps
        to the top-left corner. Position on an outer <g>, animate on an inner one.

     2. Nothing readable goes below about y=560. The caption band covers it.

     3. No teaching words anywhere - not in the narration, not painted into the
        artwork. The story must never say data, input, output, pattern, model,
        training, prediction, domain, feedback, vision, automation or password.
        Those are the answers. If they appear before Round 1 the assessment
        stops measuring anything and becomes a memory test of the video.

     4. ICONS is the single source of truth for the machine's 64-dot screen.
        The same eight strings are drawn on screen here AND used as the
        right answers in Round 1. Change a pattern and the answer changes with
        it - which is the point. Never hard-code a Round 1 answer in app.js.  */

window.STORY = (function () {
  var W = 1280, H = 720;
  var INK = '#12142a';

  /* ------------------------------------------------------------------ the
     sixty-four dots. Eight rows of eight characters; '#' is a lit dot.
     These are what the child reproduces in Round 1.                      */
  var ICONS = {
    /* the first thing it ever showed: it knew nothing yet */
    q: [
      '..####..',
      '.#....#.',
      '......#.',
      '.....#..',
      '....#...',
      '....#...',
      '........',
      '....#...'
    ],
    /* the narrow pointed leaf. It showed this for the neem - and then for
       the tulsi, the chair, the shoe and the umbrella as well.
       Pointed at BOTH ends with a short stem. An earlier version had a long
       two-wide stem and read as a dagger, not a leaf, which made nonsense of
       the caption calling it a narrow pointed shape. */
    neem: [
      '...#....',
      '..###...',
      '.#####..',
      '.#####..',
      '.#####..',
      '..###...',
      '...#....',
      '...#....'
    ],
    /* the wide leaf with the long drip tip. Its answer for a plastic leaf. */
    peepal: [
      '.##..##.',
      '.######.',
      '.######.',
      '..####..',
      '...##...',
      '...##...',
      '....#...',
      '....#...'
    ],
    /* what it put up on Friday when it got the curry leaf right */
    tick: [
      '........',
      '......##',
      '.....##.',
      '....##..',
      '#...##..',
      '##.##...',
      '.####...',
      '..##....'
    ],
    /* not used as an answer - just the dark screen at night */
    off: [
      '........',
      '........',
      '........',
      '........',
      '........',
      '........',
      '........',
      '........'
    ]
  };

  /* ---------------------------------------------------------------- css */
  var CSS = [
    '.scene text{font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;font-weight:bold}',
    '@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}',
    '@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}',
    '@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}',
    '@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}',
    '@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}',
    '@keyframes blink{0%,100%{opacity:1}50%{opacity:.18}}',
    '@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}',
    '@keyframes dashmove{to{stroke-dashoffset:-240}}',
    '@keyframes dust{0%{opacity:.8;transform:translate(0,0) scale(.6)}',
    '100%{opacity:0;transform:translate(-40px,-46px) scale(1.5)}}',
    '@keyframes grow{from{transform:scale(.35);opacity:0}to{transform:scale(1);opacity:1}}',
    '@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}',
    '50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,-2px)}}',
    '@keyframes flyin{from{transform:translate(320px,150px) scale(.3);opacity:0}',
    'to{transform:translate(0,0) scale(1);opacity:1}}',
    '.bob{animation:bob 3.4s ease-in-out infinite}',
    '.bob2{animation:bob2 4.1s ease-in-out infinite}',
    '.sway{animation:sway 4.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}',
    '.tilt{animation:tilt 3.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}',
    '.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}',
    '.blink{animation:blink 1.5s ease-in-out infinite}',
    '.glow{animation:glow 1.9s ease-in-out infinite}',
    '.shake{animation:shake .5s ease-in-out infinite}',
    '.flow{stroke-dasharray:20 15;animation:dashmove 2.6s linear infinite}',
    '.dust{animation:dust 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}',
    '.dust.d1{animation-delay:.5s}.dust.d2{animation-delay:1s}.dust.d3{animation-delay:1.6s}',
    '.scene.live .pop{animation:grow .5s cubic-bezier(.2,1.5,.4,1) both;transform-box:fill-box;transform-origin:center}',
    '.scene.live .fly{animation:flyin .8s cubic-bezier(.2,1,.4,1) both;transform-box:fill-box;transform-origin:center}',
    '.scene.live .d1{animation-delay:.35s}.scene.live .d2{animation-delay:.7s}',
    '.scene.live .d3{animation-delay:1.05s}.scene.live .d4{animation-delay:1.4s}',
    '.scene.live .d5{animation-delay:1.75s}.scene.live .d6{animation-delay:2.1s}',
    '.scene.live .d7{animation-delay:2.45s}.scene.live .d8{animation-delay:2.8s}'
  ].join('\n');

  /* ------------------------------------------------------------ helpers */

  function rr(x, y, w, h, r, fill, stroke, sw) {
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
      '" rx="' + r + '" fill="' + fill + '"' +
      (stroke ? ' stroke="' + stroke + '" stroke-width="' + (sw || 4) + '"' : '') + '/>';
  }
  function circ(cx, cy, r, fill, stroke, sw) {
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '"' +
      (stroke ? ' stroke="' + stroke + '" stroke-width="' + (sw || 4) + '"' : '') + '/>';
  }
  function P(d, fill, stroke, sw, extra) {
    return '<path d="' + d + '" fill="' + (fill || 'none') + '"' +
      (stroke ? ' stroke="' + stroke + '" stroke-width="' + (sw || 4) +
        '" stroke-linecap="round" stroke-linejoin="round"' : '') +
      (extra ? ' ' + extra : '') + '/>';
  }
  function ell(cx, cy, rx, ry, fill, stroke, sw) {
    return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry +
      '" fill="' + fill + '"' +
      (stroke ? ' stroke="' + stroke + '" stroke-width="' + (sw || 4) + '"' : '') + '/>';
  }
  /* heavy comic lettering: the ink stroke is painted behind the fill */
  function T(x, y, s, size, fill, anchor) {
    return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" fill="' + fill +
      '" text-anchor="' + (anchor || 'middle') + '" stroke="' + INK + '" stroke-width="' +
      Math.max(3, size / 7) + '" paint-order="stroke">' + s + '</text>';
  }
  function Tp(x, y, s, size, fill, anchor) {
    return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" fill="' + fill +
      '" text-anchor="' + (anchor || 'middle') + '">' + s + '</text>';
  }
  /* outer positioning group. Animations must go on a group INSIDE this one. */
  function g(x, y, s, inner) {
    return '<g transform="translate(' + x + ',' + y + ') scale(' + (s === undefined ? 1 : s) + ')">' +
      inner + '</g>';
  }
  /* the same, with a rotation - for the scattered leaves */
  function gr(x, y, s, deg, inner) {

<script>
/* pictures.js - the little drawings for Round 2, the picture word.

        No "hound" for dog, no "faucet" for tap, no bird that might be a duck.
        If a picture can be named two ways it is a bad clue and the question
        stops being fair. The HINT button reveals a picture's name, which is
        the safety net, but the drawing should not need it.

     2. Never write the name into the drawing. The letter is the whole puzzle.

   All drawings are a 100x100 viewBox, flat colour, heavy ink line, so they
   still read at 118 pixels across on a projector.                          */

    return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<g stroke="' + INK + '" stroke-width="3.4" stroke-linecap="round" ' +
      'stroke-linejoin="round">' + inner + '</g></svg>';
  }
  function P(d, fill, sw) {
    return '<path d="' + d + '" fill="' + (fill || 'none') + '"' +
      (sw ? ' stroke-width="' + sw + '"' : '') + '/>';
  }
  function C(cx, cy, r, fill, sw) {
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + (fill || 'none') + '"' +
      (sw ? ' stroke-width="' + sw + '"' : '') + '/>';
  }
  function E(cx, cy, rx, ry, fill, sw) {
    return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry +
      '" fill="' + (fill || 'none') + '"' + (sw ? ' stroke-width="' + sw + '"' : '') + '/>';
  }
  function R(x, y, w, h, r, fill) {
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
      '" rx="' + (r || 0) + '" fill="' + (fill || 'none') + '"/>';
  }
  function dot(cx, cy, r) { return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + INK + '" stroke="none"/>'; }

  var P_ = {};

  /* ---- O ------------------------------------------------------------- */

     handle on top and a drop falling out of it */
  P_.tap = {
    name: 'TAP',
    svg: svg(
      R(6, 24, 15, 46, 4, '#868e96') +
      P('M20 32 L60 32 L60 64 L44 64 L44 46 L20 46 Z', '#adb5bd') +
      R(40, 62, 24, 11, 4, '#868e96') +
      R(26, 15, 22, 10, 4, '#adb5bd') +

  };
  P_.tent = {
    name: 'TENT',

      P('M50 16 L86 76 L14 76 Z', '#e8590c') +

<script>
/* app.js - "The Leaf Machine", a Class 6 assessment on Unit 2 (What is AI?).

   Shape:  welcome -> the story -> Round 1 (draw) -> Round 2 (picture word)
           -> Round 3 (say it) -> result.

   Everything runs in the browser. Nothing is uploaded anywhere. Answers live in
   localStorage under one key, so the SAME BROWSER PROFILE resumes the SAME
   child - there is a "New student" button, and a fresh profile per child is
   safer in a shared lab.

   Marks: Round 1  4 x 3 = 12
          Round 2  6 x 2 = 12
          Round 3  8 x 2 = 16
          total          = 40

   The Round 1 answers are NOT written here. They are read out of STORY.icons,
   the same eight-row strings the machine's screen draws in the video. One
   source of truth: change the artwork and the answer changes with it.        */

(function () {
  'use strict';

  var KEY = 'leafmachine.class6.v1';
  var app = document.getElementById('app');

  /* ===================================================================
     QUESTIONS
     =================================================================== */

  /* Round 1 - reproduce the sixty-four dots.
     Two of these are plain recall. Two (d2 and d3) can only be answered by
     a child who understood WHY the box was wrong, which is the whole point
     of the story - so they are the ones worth the argument. */
  var R1 = [
    {
      id: 'd1', icon: 'q',
      ask: 'Meher switched the box on for the very first time, before it had seen a single ' +

  /* ===================================================================

     =================================================================== */

  function fresh() {

  function norm(s) {
    return (' ' + String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ') + ' ')
      .replace(/\s+/g, ' ');

    var m = a.length, n = b.length, i, j, prev, tmp, row = [];
    for (j = 0; j <= n; j++) row[j] = j;

      if (!a || a.indexOf(' ') >= 0 || a.length < 5) continue;
      for (j = 0; j < toks.length; j++) {

     some machines it does work; we warn instead, and the typed answer beside
     it is worth exactly the same marks. */
  var FILE_MODE = (window.location.protocol === 'file:');

      '<p class="muted" style="font-size:15px">' +
      (rec2.hinted ? 'The hint is showing behind your squares. This one is now worth 1 mark.'
        : 'A hint puts the right shape faintly behind the screen. The question drops to 1 mark.') +
      '</p>' +
      '<button class="btn sm plain" id="rewatch">Watch the story again</button>' +
      '</div></div>' +
      '<div class="navrow">' +
      '<button class="btn plain" id="prev">' + (i === 0 ? 'Round 1 rules' : 'Previous') + '</button>' +
      '<button class="btn go" id="nxt">' +
      (i === R1.length - 1 ? 'Finish Round 1' : 'Next question') + '</button>' +
      '</div></div>';

    wireGrid('grid', rec2, rec2.hinted ? target : null, function () { save(); });

    on('chk', 'click', function () {
      var wrong = cellsWrong(rec2.cells, target);
      rec2.checks++;
      if (wrong === 0) {
        rec2.done = true;
        rec2.mark = rec2.hinted ? 1 : (rec2.checks <= 1 ? 3 : 2);
        $('cl').textContent = 'Exactly right. ' + rec2.mark + ' out of 3.';
        $('cl').style.color = '#2f9e44';
        $('hint').disabled = true;
      } else {
        rec2.done = false; rec2.mark = 0;
        $('cl').textContent = wrong === 1
          ? 'One square is still wrong.'
          : wrong + ' squares are still wrong.';
        $('cl').style.color = '#e03131';
      }
      save();
      refreshDots(1);
    });
    on('clr', 'click', function () {
      rec2.cells = blankCells();
      rec2.done = false; rec2.mark = 0;
      save(); go('r1', i);
    });
    on('hint', 'click', function () {
      rec2.hinted = true; save(); go('r1', i);
    });
    on('rewatch', 'click', function () { go('story'); });
    on('prev', 'click', function () { i === 0 ? go('r1intro') : go('r1', i - 1); });
    on('nxt', 'click', function () {
      i === R1.length - 1 ? go('r2intro') : go('r1', i + 1);
    });
  }

  /* pointer painting: press decides paint-or-rub, then drag carries it along */
  function wireGrid(id, rec2, ghost, changed) {
    var grid = $(id);
    if (!grid) return;
    var painting = false, paintTo = true, suppressClick = false;

    function cellAt(x, y) {
      var n = document.elementFromPoint(x, y);
      if (!n || !n.classList || !n.classList.contains('pxcell')) return null;
      return grid.contains(n) ? n : null;
    }
    function apply(n) {
      if (!n) return;
      var k = parseInt(n.getAttribute('data-i'), 10);
      if (!!rec2.cells[k] === paintTo) return;
      rec2.cells[k] = paintTo;
      n.classList.toggle('on', paintTo);
      if (paintTo) n.classList.remove('ghost');
      else if (ghost) {
        /* put the faint hint back underneath, but only where the hint
           actually has a lit square - not under every square rubbed out */
        n.classList.toggle('ghost', !!ghost[k]);
      }
      if (changed) changed();
    }

    grid.addEventListener('pointerdown', function (e) {
      var n = cellAt(e.clientX, e.clientY);
      if (!n) return;
      e.preventDefault();
      suppressClick = true;
      painting = true;
      paintTo = !rec2.cells[parseInt(n.getAttribute('data-i'), 10)];
      try { grid.setPointerCapture(e.pointerId); } catch (err) { }
      apply(n);
    });
    grid.addEventListener('pointermove', function (e) {
      if (!painting) return;
      apply(cellAt(e.clientX, e.clientY));
    });
    function stop() { painting = false; }
    grid.addEventListener('pointerup', stop);
    grid.addEventListener('pointercancel', stop);
    window.addEventListener('pointerup', stop);

    /* keyboard: Enter or Space on a focused square. The pointer path fires a
       click too, so the first one after a press is swallowed. */
    grid.addEventListener('click', function (e) {
      /* Clear the flag FIRST, whatever the target is. A drag that starts on
         one square and ends on another fires its click on the grid itself,
         not on a square - and leaving the flag standing would swallow the
         next real keyboard press instead. */
      var swallow = suppressClick;
      suppressClick = false;
      if (swallow) return;
      var n = e.target;
      if (!n.classList || !n.classList.contains('pxcell')) return;
      var k = parseInt(n.getAttribute('data-i'), 10);
      paintTo = !rec2.cells[k];
      apply(n);
    });
  }

  function refreshDots(part) {
    var ns = app.querySelectorAll('.qdot'), k, r;
    for (k = 0; k < ns.length; k++) {
      if (part === 1) r = S.draw[R1[k].id];
      else if (part === 2) r = S.word[k];
      else r = S.say[k];
      ns[k].classList.toggle('done', !!(r && r.done));
      ns[k].classList.toggle('part', !!(r && !r.done && (r.checks || r.tries)));
    }
  }

  /* ----------------------------------------------- round 2: picture word */
  function wordRec(i) {
    if (!S.word[i]) S.word[i] = { done: false, hints: 0, mark: 0, tries: 0, said: '' };
    return S.word[i];
  }

  function viewWord() {
    var i = Math.max(0, Math.min(WORDS.length - 1, S.idx));
    var w = WORDS[i], rec2 = wordRec(i), k, pic;

    var strip = '<div class="rebus">';
    for (k = 0; k < w.pics.length; k++) {
      pic = PICS[w.pics[k]];
      strip += '<div class="pic"><span class="pn">' + (k + 1) + '</span>' + pic.svg +
        (k < rec2.hints ? '<span class="named">' + esc(pic.name) + '</span>' : '') + '</div>';
    }
    strip += '</div>';

    var blanks = '<div class="blanks">';
    for (k = 0; k < w.word.length; k++) {
      blanks += '<div class="blank' + (rec2.done ? ' got' : '') + '">' +
        (rec2.done ? esc(w.word.charAt(k)) : '') + '</div>';
    }
    blanks += '</div>';

    app.innerHTML =
      '<div class="panel">' +
      head(2, WORDS.length, i, function (j) {
        var r = S.word[j]; return r && r.done ? 2 : (r && r.tries ? 1 : 0);
      }, function (j) { go('r2', j); }) +
      '<span class="qtag">Word ' + (i + 1) + ' of ' + WORDS.length + ' &middot; 2 marks</span>' +
      '<p class="qtext">Take the first letter of each picture. What word do they spell?</p>' +
      strip + blanks +
      (rec2.done
        ? '<p class="gotit">' + esc(w.word) + '. Correct - ' + rec2.mark + ' out of 2.</p>'
        : '<div class="guessrow">' +
        '<input type="text" id="gw" maxlength="20" autocomplete="off" spellcheck="false" ' +
        'placeholder="Type the word" value="' + esc(rec2.said) + '">' +
        '<button class="btn go" id="gchk">Check</button>' +
        '<button class="btn cool" id="ghint"' +
        (rec2.hints >= w.pics.length ? ' disabled' : '') + '>Hint</button>' +
        '</div>' +
        '<p class="warn" id="gmsg"></p>' +
        '<p class="muted" style="font-size:15px">' +
        (rec2.hints ? 'You have used ' + rec2.hints + ' hint' + (rec2.hints > 1 ? 's' : '') +
          '. This word is now worth 1 mark.'
          : 'A hint tells you the name of one picture, and drops this word to 1 mark.') +
        '</p>') +
      '<div class="navrow">' +
      '<button class="btn plain" id="prev">' + (i === 0 ? 'Round 2 rules' : 'Previous') + '</button>' +
      '<button class="btn go" id="nxt">' +
      (i === WORDS.length - 1 ? 'Finish Round 2' : 'Next word') + '</button>' +
      '</div></div>';

    function check() {
      var v = $('gw').value.trim();
      rec2.said = v;
      rec2.tries++;
      if (v.replace(/[^a-z]/gi, '').toUpperCase() === w.word) {
        rec2.done = true;
        rec2.mark = rec2.hints > 0 ? 1 : 2;
        save(); go('r2', i);
      } else {
        $('gmsg').textContent = v ? 'Not that word. Look at the first letters again.'
          : 'Type your answer first.';
        save(); refreshDots(2);
      }
    }
    on('gchk', 'click', check);
    on('ghint', 'click', function () {
      rec2.hints++; save(); go('r2', i);
    });
    var gw = $('gw');
    if (gw) {
      gw.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); check(); }
      });
      gw.focus();
    }
    on('prev', 'click', function () { i === 0 ? go('r2intro') : go('r2', i - 1); });
    on('nxt', 'click', function () {
      i === WORDS.length - 1 ? go('r3intro') : go('r2', i + 1);
    });
  }

  /* ------------------------------------------------------- round 3: say */
  function sayRec(i) {
    if (!S.say[i]) S.say[i] = { done: false, heard: '', mark: 0, mode: '', tries: 0, hinted: false };
    return S.say[i];
  }

  function stopMic() {
    recLive = false;
    if (rec) { try { rec.abort(); } catch (e) { } rec = null; }
  }

  function viewSay() {
    var i = Math.max(0, Math.min(R3.length - 1, S.idx));
    var q = R3[i], rec2 = sayRec(i);

    app.innerHTML =
      '<div class="panel">' +
      head(3, R3.length, i, function (j) {
        var r = S.say[j]; return r && r.done ? 2 : (r && r.tries ? 1 : 0);
      }, function (j) { go('r3', j); }) +
      '<span class="qtag">Question ' + (i + 1) + ' of ' + R3.length + ' &middot; 2 marks</span>' +
      '<p class="qtext">' + esc(q.q) + '</p>' +
      '<div class="micpanel">' +
      (MIC_OK
        ? '<div class="row">' +
        '<button class="micbtn" id="mic"' + (rec2.done ? ' disabled' : '') + '>' +
        '<span class="micdot"></span><span id="miclab">Unmute and answer</span></button>' +
        '<button class="btn sm plain" id="hear">Read the question to me</button>' +
        '</div>'
        : '<p class="warn" style="margin-top:0">' + esc(micReason()) + '</p>' +
        '<div class="row"><button class="btn sm plain" id="hear">Read the question to me</button></div>') +
      (micCaution()
        ? '<p class="muted" style="font-size:15px;margin:10px 0 0"><b>Note:</b> ' +
        esc(micCaution()) + '</p>' : '') +
      '<div class="heard" id="heard"><span class="lab">What I heard</span>' +
      '<span class="txt' + (rec2.done ? '' : ' no') + '" id="htxt">' +
      (rec2.heard ? esc(rec2.heard) : '&mdash;') + '</span></div>' +
      '<div class="typefall">' +
      '<div class="guessrow">' +
      '<input type="text" id="ty" maxlength="120" autocomplete="off" placeholder="' +
      (MIC_OK ? 'or type your answer here' : 'type your answer here') + '" value="' +
      (rec2.mode === 'typed' ? esc(rec2.heard) : '') + '"' + (rec2.done ? ' disabled' : '') + '>' +
      '<button class="btn go" id="tchk"' + (rec2.done ? ' disabled' : '') + '>Check</button>' +
      '<button class="btn cool" id="shint"' + (rec2.done ? ' disabled' : '') + '>Hint</button>' +
      '</div>' +
      (rec2.hinted ? '<p class="muted" style="font-size:16px;margin-bottom:0"><b>Hint:</b> ' +
        esc(q.hint) + '</p>' : '') +
      '</div></div>' +
      '<p class="' + (rec2.done ? 'okline' : 'warn') + '" id="smsg">' +
      (rec2.done ? 'Correct - 2 out of 2.' : '') + '</p>' +
      '<div class="navrow">' +
      '<button class="btn plain" id="prev">' + (i === 0 ? 'Round 3 rules' : 'Previous') + '</button>' +
      '<button class="btn go" id="nxt">' +
      (i === R3.length - 1 ? 'See my result' : 'Next question') + '</button>' +
      '</div></div>';

    function accept(text, mode) {
      var r = sayRec(i);
      r.tries++;
      r.heard = text;
      r.mode = mode;
      if (answered(text, q.accept)) {
        r.done = true; r.mark = 2;
        save(); go('r3', i);
      } else {
        r.done = false; r.mark = 0;
        $('htxt').textContent = text || '—';
        $('htxt').className = 'txt no';
        $('smsg').textContent = text
          ? 'That is not the answer we are looking for. Try again, or press Hint.'
          : 'Nothing was heard. Try once more.';
        $('smsg').className = 'warn';
        save(); refreshDots(3);
      }
    }

    on('hear', 'click', function () { stopMic(); speak(q.q); });
    on('shint', 'click', function () { rec2.hinted = true; save(); go('r3', i); });
    on('tchk', 'click', function () { accept($('ty').value.trim(), 'typed'); });
    var ty = $('ty');
    if (ty) ty.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); accept(ty.value.trim(), 'typed'); }
    });

    if (MIC_OK) {
      on('mic', 'click', function () {
        if (recLive) { stopMic(); setMicLabel(false); return; }
        stopSpeaking();
        try {
          rec = new SR();
        } catch (err) {
          $('smsg').textContent = 'The microphone could not be started. Type the answer instead.';
          return;
        }
        rec.lang = 'en-IN';
        rec.interimResults = true;
        rec.maxAlternatives = 3;
        rec.continuous = false;
        var best = '';
        rec.onstart = function () { recLive = true; setMicLabel(true); $('smsg').textContent = ''; };
        rec.onresult = function (ev) {
          var k, j, txt = '', alts = [];
          for (k = ev.resultIndex; k < ev.results.length; k++) {
            txt += ev.results[k][0].transcript;
            if (ev.results[k].isFinal) {
              for (j = 0; j < ev.results[k].length; j++) alts.push(ev.results[k][j].transcript);
            }
          }
          best = txt;
          $('htxt').textContent = txt || '—';
          if (alts.length) {
            /* if any alternative the recogniser offered is right, take it -
               it mishears children far more often than it mishears adults */
            for (j = 0; j < alts.length; j++) {
              if (answered(alts[j], q.accept)) { best = alts[j]; break; }
            }
          }
        };
        rec.onerror = function (ev) {
          recLive = false; setMicLabel(false);
          var m = 'The microphone did not work. Type the answer instead.';
          if (ev && ev.error === 'not-allowed') {
            m = 'The microphone was blocked. Allow it in the address bar, or type the answer.';
          } else if (ev && ev.error === 'no-speech') {
            m = 'Nothing was heard. Press the button and speak clearly.';
          } else if (ev && ev.error === 'network') {
            m = 'Speech needs the internet and it is not reachable. Type the answer instead.';
          }
          $('smsg').textContent = m;
          $('smsg').className = 'warn';
        };
        rec.onend = function () {
          recLive = false; setMicLabel(false);
          if (best) accept(best.trim(), 'mic');
        };
        try { rec.start(); } catch (err) {
          $('smsg').textContent = 'The microphone is already listening. Wait a moment.';
        }
      });
    }
    function setMicLabel(live) {
      var b = $('mic'), l = $('miclab');
      if (!b || !l) return;
      b.classList.toggle('live', live);
      l.textContent = live ? 'Listening - say it now' : 'Unmute and answer';
    }

    on('prev', 'click', function () { i === 0 ? go('r3intro') : go('r3', i - 1); });
    on('nxt', 'click', function () {
      i === R3.length - 1 ? go('result') : go('r3', i + 1);
    });
  }

  /* ------------------------------------------------------------ result */
  function totals() {
    var a = 0, b = 0, c = 0, i;
    for (i = 0; i < R1.length; i++) a += (S.draw[R1[i].id] && S.draw[R1[i].id].mark) || 0;
    for (i = 0; i < WORDS.length; i++) b += (S.word[i] && S.word[i].mark) || 0;
    for (i = 0; i < R3.length; i++) c += (S.say[i] && S.say[i].mark) || 0;
    return { r1: a, r2: b, r3: c, all: a + b + c };
  }

  function miniGrid(cells) {
    var out = '<div class="minigrid">', i;
    for (i = 0; i < 64; i++) out += '<i' + (cells[i] ? ' class="on"' : '') + '></i>';
    return out + '</div>';
  }

  function viewResult() {
    var t = totals(), i, rows = '', r, q;

    rows += '<h3 class="revhead">Round 1 &middot; Draw the dots</h3><div class="review">';
    for (i = 0; i < R1.length; i++) {
      q = R1[i]; r = S.draw[q.id];
      rows += '<div class="rev ' + (r && r.done ? (r.mark === 3 ? 'ok' : 'half') : 'no') + '">' +
        '<span class="mark">' + ((r && r.mark) || 0) + '/3</span><div>' +
        '<b>Question ' + (i + 1) + '</b>' +
        '<span class="said">' + esc(q.ask) + '</span>' +
        '<div class="revgrid">' +
        '<div><div class="minilab">yours</div>' + miniGrid((r && r.cells) || blankCells()) + '</div>' +
        '<div><div class="minilab">right</div>' + miniGrid(patCells(q.icon)) + '</div>' +
        '</div></div></div>';
    }
    rows += '</div>';

    rows += '<h3 class="revhead">Round 2 &middot; The picture word</h3><div class="review">';
    for (i = 0; i < WORDS.length; i++) {
      r = S.word[i];
      rows += '<div class="rev ' + (r && r.done ? (r.mark === 2 ? 'ok' : 'half') : 'no') + '">' +
        '<span class="mark">' + ((r && r.mark) || 0) + '/2</span><div>' +
        '<b>' + esc(WORDS[i].word) + '</b>' +
        '<span class="said">' +
        (r && r.done ? 'Correct' + (r.hints ? ' after ' + r.hints + ' hint' +
          (r.hints > 1 ? 's' : '') : '') : 'Wrote: ' + esc((r && r.said) || 'nothing')) +
        '</span></div></div>';
    }
    rows += '</div>';

    rows += '<h3 class="revhead">Round 3 &middot; Say it out loud</h3><div class="review">';
    for (i = 0; i < R3.length; i++) {
      r = S.say[i];
      rows += '<div class="rev ' + (r && r.done ? 'ok' : 'no') + '">' +
        '<span class="mark">' + ((r && r.mark) || 0) + '/2</span><div>' +
        '<b>' + esc(R3[i].q) + '</b>' +
        '<span class="said">' +
        (r && r.heard ? (r.mode === 'typed' ? 'Typed: ' : 'Said: ') + esc(r.heard)
          : 'No answer given') +
        (r && r.hinted ? ' &middot; used the hint' : '') +
        '</span></div></div>';
    }
    rows += '</div>';

    app.innerHTML =
      '<div class="panel">' +
      '<div class="row spread"><h1>Result</h1><span class="qtag">' + esc(S.name) + '</span></div>' +
      '<div class="scorebox"><div class="num">' + t.all + ' / ' + MAXALL + '</div>' +
      '<div class="big">' + esc(S.name) + '</div></div>' +
      '<div class="partscores">' +
      '<div class="ps">Round 1 &middot; Draw <span>' + t.r1 + '/' + MAX1 + '</span></div>' +
      '<div class="ps">Round 2 &middot; Words <span>' + t.r2 + '/' + MAX2 + '</span></div>' +
      '<div class="ps">Round 3 &middot; Speaking <span>' + t.r3 + '/' + MAX3 + '</span></div>' +
      '</div>' + rows +
      '<div class="navrow noprint">' +
      '<button class="btn plain" id="reset">New student</button>' +
      '<div class="row">' +
      '<button class="btn plain" id="back3">Back to Round 3</button>' +
      '<button class="btn cool" id="prn">Print / Save as PDF</button>' +
      '<button class="btn go" id="dl">Download my answers</button>' +
      '</div></div></div>';

    on('prn', 'click', function () { window.print(); });
    on('back3', 'click', function () { go('r3', R3.length - 1); });
    on('reset', 'click', function () {
      if (window.confirm('Clear this student\'s answers so the next one can start?')) {
        S = fresh(); save(); go('welcome');
      }
    });
    on('dl', 'click', downloadJSON);
  }

  function downloadJSON() {
    var t = totals(), out = {
      assessment: 'The Leaf Machine - Class 6, Unit 2 (What is AI?)',
      student: S.name,
      started: S.started,
      finished: new Date().toISOString(),
      total: t.all, outOf: MAXALL,
      rounds: { draw: t.r1, words: t.r2, speaking: t.r3 },
      answers: { draw: {}, words: {}, speaking: {} }
    }, i, r;
    for (i = 0; i < R1.length; i++) {
      r = S.draw[R1[i].id] || {};
      out.answers.draw[R1[i].id] = {
        correct: !!r.done, mark: r.mark || 0, checks: r.checks || 0,
        usedHint: !!r.hinted, drew: (r.cells || blankCells()).map(function (b) { return b ? 1 : 0; }).join('')
      };
    }
    for (i = 0; i < WORDS.length; i++) {
      r = S.word[i] || {};
      out.answers.words[WORDS[i].word] = {
        correct: !!r.done, mark: r.mark || 0, hints: r.hints || 0, wrote: r.said || ''
      };
    }
    for (i = 0; i < R3.length; i++) {
      r = S.say[i] || {};
      out.answers.speaking['q' + (i + 1)] = {
        question: R3[i].q, correct: !!r.done, mark: r.mark || 0,
        answer: r.heard || '', how: r.mode || '', usedHint: !!r.hinted
      };
    }
    var blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'leaf-machine-' +
      S.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 400);
  }

  /* ===================================================================
     GO
     =================================================================== */
  window.addEventListener('beforeunload', function () { stopSpeaking(); stopMic(); });
  render();

  /* exposed only so the smoke test can drive it */
  window.__leaf = {
    state: function () { return S; },
    go: go,
    totals: totals,
    answered: answered,
    patCells: patCells,
    R1: R1, R3: R3, WORDS: WORDS
  };
})();

</script>
</body>

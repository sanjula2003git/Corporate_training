<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Thursday Thief - Class 6 (single file)</title>
<style>
:root{
  --ink:#12142a; --ink2:#3a3f66; --paper:#fdf7ea; --paper2:#f3e9d4;
  --red:#e03131; --yellow:#ffd43b; --blue:#1c7ed6;
  --green:#2f9e44; --purple:#7048e8; --line:#12142a;
  --shadow:7px 7px 0 var(--line);
  --shadow-sm:4px 4px 0 var(--line);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;
  color:var(--ink);
  height:100%;
  /* the page itself never scrolls. Everything is sized to the viewport, and
     the one region that genuinely cannot fit - the answer review on the
     results screen - scrolls inside .body instead. */
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  /* comic backdrop: a sunburst behind the panel, halftone dots over it */
  background-color:#0e1030;
  background-image:
    radial-gradient(circle at 50% 34%, rgba(255,212,59,.20), transparent 46%),
    radial-gradient(circle at 12% 88%, rgba(28,126,214,.24), transparent 42%),
    radial-gradient(circle at 88% 12%, rgba(112,72,232,.26), transparent 44%),
    repeating-conic-gradient(from 0deg at 50% 34%,
      rgba(255,255,255,.035) 0deg 5deg, rgba(255,255,255,0) 5deg 11deg),
    radial-gradient(rgba(255,255,255,.055) 1.5px, transparent 1.6px);
  background-size:auto,auto,auto,auto,20px 20px;
  background-attachment:fixed;
}
.wrap{
  max-width:1280px;margin:0 auto;padding:14px 16px;
  height:100vh;height:100dvh;      /* dvh so mobile browser bars do not clip it */
  display:flex;flex-direction:column;
}

.panel{
  background:var(--paper);
  border:5px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:18px 24px;
  flex:1 1 auto;min-height:0;      /* fills the viewport, never exceeds it */
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
/* everything above the buttons. The nav row lives outside it, so Next and
   Back are on screen at all times without scrolling for them. */
.body{
  flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;
  scrollbar-gutter:stable;
}
.body::-webkit-scrollbar{width:12px}
.body::-webkit-scrollbar-thumb{background:var(--ink2);border-radius:8px;border:3px solid var(--paper)}

h1,h2,h3{margin:0 0 8px;line-height:1.1;letter-spacing:.5px}
h1{font-size:clamp(24px,3.4vw,38px);text-transform:uppercase}
h2{font-size:clamp(19px,2.4vw,26px);text-transform:uppercase}
p{line-height:1.5;font-size:16px}
.big{font-size:18px}
.muted{color:var(--ink2)}
.warn{color:var(--red);font-weight:bold;min-height:20px;margin:8px 0 0}

.btn{
  font:inherit;font-weight:bold;font-size:17px;
  padding:11px 20px;border:4px solid var(--line);border-radius:12px;
  background:var(--yellow);color:var(--ink);cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:transform .06s ease, box-shadow .06s ease;
}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--line)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:var(--shadow-sm)}
.btn.go{background:var(--green);color:#fff}
.btn.hot{background:var(--red);color:#fff}
.btn.plain{background:var(--paper2)}
.btn.sm{font-size:15px;padding:9px 15px;border-width:3px}

label{display:block;font-weight:bold;margin:10px 0 5px;font-size:15px}
input[type=text],textarea{
  width:100%;font:inherit;font-size:17px;padding:10px 13px;
  border:3px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
}
input:focus,textarea:focus{outline:4px solid var(--yellow);outline-offset:1px}

.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.grow{flex:1 1 220px}
/* outside .body, so the buttons are always visible without scrolling */
.navrow{
  display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;
  flex:0 0 auto;margin-top:0;padding-top:14px;
  border-top:3px solid rgba(18,20,42,.12);margin-top:12px;
}

/* ---------- welcome ---------- */
.hero-title{text-align:center;padding:4px 0 10px}
.kicker{
  display:inline-block;background:var(--red);color:#fff;font-weight:bold;
  padding:7px 16px;border:3px solid var(--line);border-radius:8px;
  transform:rotate(-2deg);text-transform:uppercase;letter-spacing:1px;font-size:14px;
}
.title-main{
  /* vmin, not vw: on a short wide screen the title has to shrink with the
     height as well, or it eats the space the form needs */
  font-size:clamp(30px,7vmin,58px);font-weight:bold;text-transform:uppercase;
  letter-spacing:1px;line-height:.98;margin:10px 0 6px;
  color:var(--yellow);
  -webkit-text-stroke:3px var(--line);
  paint-order:stroke fill;
  text-shadow:6px 6px 0 var(--blue);
}
.subtitle{font-size:clamp(15px,2.2vmin,20px);font-weight:bold;color:var(--ink2);text-transform:uppercase}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0}
.step{background:var(--paper2);border:3px solid var(--line);border-radius:12px;padding:12px 14px}
.step p{margin:4px 0 0;font-size:14px;line-height:1.4}
.step .n{
  /* flex, not inline-flex: the heading must drop onto its own line below */
  display:flex;width:30px;height:30px;align-items:center;justify-content:center;
  background:var(--blue);color:#fff;border:3px solid var(--line);border-radius:50%;
  font-weight:bold;margin-bottom:7px;font-size:15px;
}

/* ---------- story stage ----------
   The picture has to fit the screen height, not just its width, or the play
   controls end up below the fold. Height is what is scarce, so the width is
   derived from the height that is left over after the chrome around it, and
   only then capped at 100%. --stage-chrome is everything else on this screen:
   wrap padding, panel border and padding, the heading, the control bar and
   the nav row. Measured, not guessed - tests/fit.mjs checks it. */
.stage{
  --stage-chrome:290px;
  position:relative;
  width:min(100%, calc((100dvh - var(--stage-chrome)) * 16 / 9));
  aspect-ratio:16/9;
  flex:0 0 auto;margin:0 auto;
  background:#0b0d1c;border:5px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene{opacity:0;transition:opacity .5s ease;pointer-events:none;will-change:transform,opacity}
.scene.live{opacity:1}
/* Captions come in a word at a time (app.js writes the per-word delays), which
   is the difference between a line being spoken and a line being pasted up.
   Everything is still in the DOM as one plain sentence. */
@keyframes capw{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.caption .w{display:inline-block;animation:capw .42s cubic-bezier(.2,.9,.3,1) both}
@media (prefers-reduced-motion:reduce){
  .caption .w{animation:none}
  .stage .scene,.stage .scene *{animation:none!important}
}
.caption{
  position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(to top,rgba(8,10,22,.94),rgba(8,10,22,.7) 72%,transparent);
  color:#fff;padding:28px 20px 14px;font-size:clamp(15px,2.1vmin,22px);
  font-weight:bold;text-align:center;line-height:1.35;min-height:58px;
  text-shadow:0 2px 6px #000;
}
.controls{
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  margin-top:12px;background:var(--paper2);border:4px solid var(--line);
  border-radius:12px;padding:10px 12px;
  width:min(100%, calc((100dvh - 290px) * 16 / 9));margin-inline:auto;
  flex:0 0 auto;
}
.bar{
  flex:1 1 200px;height:16px;background:#fff;
  border:3px solid var(--line);border-radius:10px;overflow:hidden;min-width:140px;cursor:pointer;
}
.bar i{display:block;height:100%;width:0;background:var(--red)}
.time{font-weight:bold;font-variant-numeric:tabular-nums;font-size:16px}

/* ---------- part intro ---------- */
.partbadge{
  align-self:flex-start;background:var(--purple);color:#fff;font-weight:bold;
  padding:7px 16px;border:3px solid var(--line);border-radius:9px;
  text-transform:uppercase;letter-spacing:1px;font-size:14px;margin-bottom:12px;
}
.parttitle{font-size:clamp(28px,6vmin,50px);color:var(--red);-webkit-text-stroke:2px var(--line);paint-order:stroke fill}
.demo{margin:14px 0;padding:14px;background:var(--paper2);border:3px dashed var(--line);border-radius:14px}
.democap{margin:0 0 10px;font-weight:bold;font-size:15px;color:var(--ink2)}

/* ---------- quiz chrome ---------- */
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;flex:0 0 auto}
.partchip{
  background:var(--purple);color:#fff;font-weight:bold;font-size:13px;
  padding:6px 13px;border:3px solid var(--line);border-radius:8px;
  text-transform:uppercase;letter-spacing:.6px;
}
.qdots{display:flex;gap:6px;flex-wrap:wrap}
.qdot{
  width:30px;height:30px;border:3px solid var(--line);border-radius:8px;
  background:var(--paper2);font-weight:bold;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;color:var(--ink);
}
.qdot.done{background:var(--green);color:#fff}
.qdot.here{outline:3px solid var(--red);outline-offset:2px}
.qtag{
  /* align-self, because .panel is a flex column and children stretch by default */
  align-self:flex-start;
  background:var(--yellow);font-weight:bold;font-size:14px;
  padding:5px 13px;border:3px solid var(--line);border-radius:8px;letter-spacing:.6px;
}
.qtext{font-size:clamp(18px,2.5vmin,25px);font-weight:bold;margin:9px 0 13px;line-height:1.3}

/* ---------- part 1: the pattern ---------- */
.pattern{
  display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:end;
  margin-bottom:16px;
}
@media(max-width:820px){
  .pattern{grid-template-columns:1fr}
  .arrowcell{transform:rotate(90deg);height:34px}
}
.slotlab{
  font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:.7px;
  text-align:center;margin-bottom:6px;
}
.slotlab.sit{color:var(--blue)} .slotlab.skill{color:var(--red)} .slotlab.act{color:var(--green)}
.slot{
  min-height:clamp(70px,11vmin,100px);display:flex;align-items:center;justify-content:center;
  text-align:center;padding:10px;border-radius:14px;font-weight:bold;font-size:clamp(15px,1.8vmin,17px);
  border:4px solid var(--line);background:#fff;
}
.slot.think{background:var(--ink);color:var(--yellow);letter-spacing:.5px}
.slot.drop{border-style:dashed;background:var(--paper2);cursor:pointer}
.slot.drop.full{border-style:solid;background:#fff3bf}
.slot.hot{background:#d3f9d8;border-style:solid;transform:scale(1.03)}
.ghosttext{color:var(--ink2);font-weight:normal;font-size:15px}
.arrowcell{display:flex;align-items:center;justify-content:center;height:clamp(70px,11vmin,100px)}
.arrowmark{
  width:44px;height:14px;background:var(--ink);position:relative;border-radius:2px;
}
.arrowmark:after{
  content:"";position:absolute;right:-16px;top:-9px;
  border-left:20px solid var(--ink);border-top:16px solid transparent;border-bottom:16px solid transparent;
}
.traylab{font-size:14px;color:var(--ink2);margin:0 0 8px;font-weight:bold}
.cards{display:flex;gap:10px;flex-wrap:wrap;min-height:52px;align-items:flex-start}
.card{
  background:#fff;border:4px solid var(--line);border-radius:12px;
  padding:10px 14px;font-size:clamp(15px,1.8vmin,17px);font-weight:bold;cursor:grab;
  box-shadow:var(--shadow-sm);max-width:330px;text-align:left;font-family:inherit;color:var(--ink);
  touch-action:none;user-select:none;
}
.card.picked{background:var(--yellow);outline:4px solid var(--red);outline-offset:2px}
.card.lifting{opacity:.35}
.ghostcard{
  position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg);
  background:var(--yellow);border:4px solid var(--line);border-radius:12px;
  padding:13px 16px;font-weight:bold;font-size:17px;box-shadow:var(--shadow);
  font-family:inherit;color:var(--ink);max-width:330px;
}

/* ---------- part 2: mcq ---------- */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  text-align:left;font:inherit;font-size:clamp(15px,1.9vmin,18px);font-weight:bold;color:var(--ink);
  background:#fff;border:4px solid var(--line);border-radius:12px;padding:11px 15px;
  cursor:pointer;box-shadow:var(--shadow-sm);display:flex;gap:13px;align-items:flex-start;
}
.opt:hover{transform:translate(-2px,-2px)}
.opt .k{
  flex:0 0 auto;width:31px;height:31px;border:3px solid var(--line);border-radius:50%;
  background:var(--paper2);display:flex;align-items:center;justify-content:center;font-size:15px;
}
.opt.chosen{background:var(--yellow)}
.opt.chosen .k{background:var(--red);color:#fff}

/* ---------- part 3: guessing game ---------- */
.blanks{display:flex;gap:9px;flex-wrap:wrap;margin:4px 0 16px}
.blank{
  width:clamp(38px,5.5vmin,52px);height:clamp(46px,7vmin,64px);border:4px solid var(--line);
  border-bottom-width:9px;border-radius:9px;background:#fff;display:flex;
  align-items:center;justify-content:center;font-size:clamp(23px,4vmin,32px);font-weight:bold;
}
.blank.got{background:var(--green);color:#fff}
.clues{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.clue{
  background:var(--paper2);border:3px solid var(--line);border-radius:12px;
  padding:10px 14px;font-size:clamp(15px,1.9vmin,18px);font-weight:bold;
}
.cluen{
  display:inline-block;background:var(--blue);color:#fff;font-size:12px;
  padding:3px 10px;border-radius:6px;margin-right:10px;letter-spacing:.6px;
  text-transform:uppercase;vertical-align:2px;
}
.guessrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.guessrow input{flex:1 1 260px;font-size:20px;font-weight:bold;text-transform:uppercase}
.gotit{font-size:21px;font-weight:bold;color:var(--green)}

/* ---------- result ---------- */
.scorebox{
  text-align:center;background:var(--yellow);border:5px solid var(--line);
  border-radius:16px;padding:12px 18px;box-shadow:var(--shadow-sm);margin-bottom:10px;
}
.scorebox .num{font-size:clamp(32px,7vmin,58px);font-weight:bold;line-height:1}
.partscores{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.ps{
  background:var(--paper2);border:3px solid var(--line);border-radius:12px;
  padding:9px 14px;display:flex;justify-content:space-between;align-items:center;font-size:16px;
}
.ps span{font-weight:bold;font-size:21px}
.revhead{
  margin:12px 0 7px;font-size:17px;text-transform:uppercase;color:var(--purple);
  border-bottom:3px solid var(--line);padding-bottom:4px;
}
/* the one list that cannot fit a screen: 18 marks of answers. It scrolls
   inside the panel, so the score above it and the buttons below it stay put.
   The hint is there because a Class 6 student will not go looking. */
.revtop{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  justify-content:space-between;flex:0 0 auto;margin-bottom:2px;
}
.scrollhint{font-weight:bold;font-size:14px}
.review{display:flex;flex-direction:column;gap:8px}
.rev{
  border:3px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;
  display:flex;gap:11px;align-items:flex-start;font-size:15px;
}
.rev.ok{background:#ebfbee} .rev.no{background:#fff0f0}
.rev .mark{font-weight:bold;font-size:20px;flex:0 0 auto;width:28px;text-align:center}
.rev b{display:block;margin-bottom:3px}
.rev .said{color:var(--ink2);font-size:15px;display:block}

@media print{
  body{background:#fff;height:auto;overflow:visible}
  html,body{height:auto}
  .noprint{display:none !important}
  /* on paper there is no viewport to fit, so undo the whole screen-height
     layout - otherwise the answer review prints as one clipped page */
  .wrap{height:auto;display:block;padding:0}
  .panel{box-shadow:none;min-height:0;height:auto;overflow:visible;break-inside:avoid}
  .body{overflow:visible;display:block;min-height:0}
  .review{display:block}
  .rev{break-inside:avoid;margin-bottom:8px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<audio id="narration"></audio>
<script>
/* scenes.js - hand-drawn comic scenes for "The Thursday Thief".
   Every scene is one <svg class="scene"> stacked in the stage; app.js turns
   exactly one of them "live" as the story plays. Pure SVG + CSS, no images.

   Three rules if you touch the artwork:
     1. Never put an animation class on a <g> that also has a transform
        attribute. A CSS transform replaces the attribute and the art snaps to
        the top-left corner. Position on an outer <g>, animate on an inner one.
     2. Nothing readable goes below about y=560. The caption band covers it.
     3. No teaching words in the pictures. The scenes say "MISSING" and
        "THURSDAY", never "observation", "pattern" or "memory". If the
        vocabulary appears before Part 1, the assessment stops measuring
        anything. */
(function () {
  var W = 1280, H = 720;
  var INK = '#12142a';

  /* ---------------------------------------------------------------- css */
  var CSS = [
    '.scene text{font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;font-weight:bold}',

    /* -------------------------------------------------------- the camera
       Each scene has its own generated move - see SHOTS and cameraCSS at the
       bottom of this file. It runs on the <svg class="scene"> element itself,
       never on a group inside the art, so it can never collide with a
       transform attribute (rule 1 at the top of this file). --hold is the
       seconds that scene is really on screen and --tin is how far into it we
       already are (a negative number), both written by app.js, so dragging
       the bar lands in the middle of a move instead of starting it again. */
    '@keyframes camdrift{from{transform:scale(1.05) translate(1.2%,0.7%)}',
    'to{transform:scale(1.15) translate(-1.2%,-0.7%)}}',
    '.scene{transform:scale(1.08)}',
    '.scene.live{animation-name:var(--cam,camdrift);animation-duration:var(--hold,14s);' +
      'animation-delay:var(--tin,0s);animation-timing-function:cubic-bezier(.35,0,.25,1);' +
      'animation-fill-mode:both}',

    /* ----------------------------------------------------- idle movement
       Every looping animation is gated on .live, so a scene that is not on
       screen animates nothing and eighteen idle SVGs stay off the CPU. The
       stage loses its .playing class whenever the story is paused, and
       everything inside it holds still with it - otherwise the pictures keep
       moving under a frozen caption, which is worse than not moving at all. */
    '@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}',
    '@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}',
    '@keyframes hop{0%,100%{transform:translate(0,0)}30%{transform:translate(26px,-22px)}',
    '60%{transform:translate(52px,0)}80%{transform:translate(52px,-6px)}}',
    '@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}',
    '@keyframes glint{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}',
    '@keyframes tick{0%,100%{transform:rotate(0deg)}50%{transform:rotate(6deg)}}',
    '@keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}',
    '@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}',
    '@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}',
    '@keyframes dashmove{to{stroke-dashoffset:-200}}',
    '@keyframes fly{from{transform:translate(0,0)}to{transform:translate(430px,-250px)}}',
    '@keyframes grow{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}',
    '@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}',
    /* a blink is one fast frame of shut eye in every six seconds */
    '@keyframes lid{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.06)}}',
    /* dust in a sunbeam: up and across, fading in and out at the ends */
    '@keyframes mote{0%{opacity:0;transform:translate(0,0)}',
    '14%{opacity:.85}82%{opacity:.6}100%{opacity:0;transform:translate(46px,-104px)}}',
    '@keyframes shimmer{0%,100%{opacity:.10}50%{opacity:.26}}',
    '@keyframes sweep{to{transform:rotate(360deg)}}',
    '@keyframes swingopen{0%{transform:rotate(-52deg)}70%{transform:rotate(6deg)}',
    '100%{transform:rotate(0deg)}}',
    '@keyframes peck{0%,72%,100%{transform:rotate(0deg)}84%{transform:rotate(22deg)}}',
    '@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.014)}}',
    /* Arms hinge at the shoulder, heads turn on the neck, and a mouth that is
       saying something opens and closes. Without these a drawn child is a
       cut-out with a bobbing head, which is exactly what it looks like. */
    '@keyframes armswing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}',
    '@keyframes armswing2{0%,100%{transform:rotate(3.5deg)}50%{transform:rotate(-4.5deg)}}',
    '@keyframes jab{0%,58%,100%{transform:rotate(0deg)}72%{transform:rotate(-8deg)}',
    '86%{transform:rotate(-2deg)}}',
    '@keyframes headturn{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.8deg)}}',
    '@keyframes talk{0%,100%{transform:scaleY(.45)}11%{transform:scaleY(1)}',
    '24%{transform:scaleY(.5)}37%{transform:scaleY(.95)}',
    '51%{transform:scaleY(.4)}64%{transform:scaleY(1)}82%{transform:scaleY(.55)}}',

    '.scene.live .bob{animation:bob 3.4s ease-in-out infinite}',
    '.scene.live .bob2{animation:bob2 4.1s ease-in-out infinite}',
    '.scene.live .hop{animation:hop 3.6s ease-in-out infinite}',
    '.scene.live .flap{animation:flap .32s ease-in-out infinite}',
    '.flap{transform-box:fill-box;transform-origin:top center}',
    '.scene.live .glint{animation:glint 2.1s ease-in-out infinite}',
    '.glint{transform-box:fill-box;transform-origin:center}',
    '.glint.g1{animation-delay:.35s}.glint.g2{animation-delay:.7s}',
    '.glint.g3{animation-delay:1.05s}.glint.g4{animation-delay:1.4s}',
    '.scene.live .tick{animation:tick 2.4s ease-in-out infinite}',
    '.tick{transform-box:fill-box;transform-origin:bottom center}',
    '.scene.live .tilt{animation:tilt 3s ease-in-out infinite}',
    '.tilt{transform-box:fill-box;transform-origin:center}',
    '.scene.live .pulse{animation:pulse 2.2s ease-in-out infinite}',
    '.pulse{transform-box:fill-box;transform-origin:center}',
    '.scene.live .blink{animation:blink 1.6s ease-in-out infinite}',
    '.scene.live .sway{animation:sway 4.5s ease-in-out infinite}',
    '.sway{transform-box:fill-box;transform-origin:bottom center}',
    '.flow{stroke-dasharray:22 16}',
    '.scene.live .flow{animation:dashmove 2.4s linear infinite}',
    '.scene.live .lid{animation:lid 6.4s ease-in-out infinite}',
    '.lid{transform-box:fill-box;transform-origin:center}',
    '.scene.live .mote{animation:mote 13s linear infinite}',
    '.scene.live .shimmer{animation:shimmer 6s ease-in-out infinite}',
    '.scene.live .sechand{animation:sweep 60s steps(60,end) infinite}',
    '.sechand{transform-box:fill-box;transform-origin:center bottom}',
    '.scene.live .peck{animation:peck 4.4s ease-in-out infinite}',
    '.peck{transform-box:fill-box;transform-origin:right bottom}',
    '.scene.live .breathe{animation:breathe 5.6s ease-in-out infinite}',
    '.breathe{transform-box:fill-box;transform-origin:center bottom}',
    /* The pivot is whichever corner of the arm's own bounding box the shoulder
       sits in: an arm that hangs down has its shoulder at the TOP of its box,
       one that is raised or pointing has it at the BOTTOM. Get this wrong and
       the arm swings from the hand. */
    '.scene.live .armrd{animation:armswing 4.2s ease-in-out infinite}',
    '.armrd{transform-box:fill-box;transform-origin:left top}',
    '.scene.live .armld{animation:armswing2 4.6s ease-in-out infinite}',
    '.armld{transform-box:fill-box;transform-origin:right top}',
    '.scene.live .armru{animation:armswing 5.2s ease-in-out infinite}',
    '.armru{transform-box:fill-box;transform-origin:left bottom}',
    '.scene.live .jab{animation:jab 2.9s ease-in-out infinite}',
    '.jab{transform-box:fill-box;transform-origin:left bottom}',
    '.scene.live .head{animation:headturn 6.8s ease-in-out infinite}',
    '.head{transform-box:fill-box;transform-origin:center bottom}',
    '.scene.live .talk{animation:talk .9s ease-in-out infinite}',
    '.talk{transform-box:fill-box;transform-origin:center}',

    /* ------------------------------------------------------------- beats
       .pop reveals a thing once. Which second it arrives is set by a beat
       class - b0 is the moment the scene opens, b1 the second caption line
       of that scene, b2 the third, and bNxM steps between them - and the
       real delays are written by app.js out of the caption track, so a
       label always lands on the sentence that says it. d1..d5 stay for
       quick decorative staggers that belong to no line. */
    '.scene.live .pop{animation:grow .55s cubic-bezier(.2,1.5,.4,1) both}',
    '.pop{transform-box:fill-box;transform-origin:center}',
    '.scene.live .pop.d1{animation-delay:.5s}.scene.live .pop.d2{animation-delay:1s}',
    '.scene.live .pop.d3{animation-delay:1.5s}.scene.live .pop.d4{animation-delay:2s}',
    '.scene.live .pop.d5{animation-delay:2.5s}',
    '.scene.live .fly{animation:fly 3.4s ease-in both}',
    '.scene.live .swing{animation:swingopen 1.1s cubic-bezier(.3,1.4,.5,1) both}',
    '.swing{transform-box:fill-box;transform-origin:left center}',

    /* pause the whole picture with the story */
    '.stage.started:not(.playing) .scene,' +
      '.stage.started:not(.playing) .scene *{animation-play-state:paused}'
  ].join('\n');

  /* ------------------------------------------------------------ helpers */

  /* big comic lettering: fill with a heavy ink stroke painted behind it */
  function T(x, y, s, size, fill, anchor) {
    return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" fill="' + fill +
      '" text-anchor="' + (anchor || 'middle') + '" stroke="' + INK + '" stroke-width="' +
      Math.max(3, size / 7) + '" paint-order="stroke">' + s + '</text>';
  }
  function Tp(x, y, s, size, fill, anchor) {
    return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" fill="' + fill +
      '" text-anchor="' + (anchor || 'middle') + '">' + s + '</text>';
  }

  /* ---- room shell: back wall, blackboard, floor ----
     Pass noBoard for the scenes whose subject sits in the middle of the wall
     (the cupboard, the window, the notebook). Drawing the blackboard behind
     those just puts two big rectangles on top of each other. */
  function room(u, mood, noBoard) {
    var wall = mood === 'dim' ? '#c9b48f' : mood === 'warm' ? '#f6e6c6' : '#efdcb8';
    var floor = mood === 'dim' ? '#6b4f36' : '#8a6a49';
    var s = '<defs><linearGradient id="w' + u + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + wall + '"/>' +
      '<stop offset="1" stop-color="' + shade(wall, -18) + '"/></linearGradient></defs>' +
      '<rect width="' + W + '" height="' + H + '" fill="url(#w' + u + ')"/>' +
      /* skirting + floor */
      '<rect x="0" y="500" width="' + W + '" height="' + (H - 500) + '" fill="' + floor + '"/>' +
      '<rect x="0" y="492" width="' + W + '" height="16" fill="#5b4130"/>';
    if (!noBoard) {
      s += '<g><rect x="120" y="90" width="560" height="270" rx="10" fill="#24402f" stroke="' + INK +
        '" stroke-width="9"/>' +
        '<rect x="120" y="352" width="560" height="26" rx="6" fill="#8a6a49" stroke="' + INK +
        '" stroke-width="7"/></g>';
    }
    return s;
  }

  /* lighten / darken a #rrggbb by a percentage of full scale */
  function shade(hex, pct) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    function c(v) { return Math.max(0, Math.min(255, Math.round(v + 255 * pct / 100))); }
    return '#' + ((1 << 24) + (c(r) << 16) + (c(g) << 8) + c(b)).toString(16).slice(1);
  }

  /* ---- one child, drawn from the waist up unless sitting ---- */
  var LOOK = {
    tanvi:  { skin: '#c98a5b', hair: '#1a1520', top: '#fdf7ea', low: '#1c4f8c', plait: true },
    imran:  { skin: '#a9713f', hair: '#161219', top: '#fdf7ea', low: '#1c4f8c' },
    yash:   { skin: '#e0a878', hair: '#2a1f18', top: '#fdf7ea', low: '#1c4f8c' },
    kid1:   { skin: '#8d5c31', hair: '#1a1520', top: '#fdf7ea', low: '#1c4f8c', plait: true },
    kid2:   { skin: '#d99a68', hair: '#241a14', top: '#fdf7ea', low: '#1c4f8c' },
    rao:    { skin: '#c08050', hair: '#1a1520', top: '#c2255c', low: '#7a1740', adult: true },
    ramesh: { skin: '#9a6538', hair: '#3a3a3a', top: '#3f8f5f', low: '#33502f', adult: true }
  };

  /* who: key into LOOK. anim: a class name put on an INNER group (never on the
     positioned one - see rule 1 at the top of this file). */
  function kid(who, x, y, s, anim, opts) {
    opts = opts || {};
    var L = LOOK[who] || LOOK.kid2;
    var g = '';
    var headY = opts.down ? -118 : -128;      /* head hangs a little when down */

    /* body */
    g += '<path d="M -46 0 L -40 -86 Q 0 -104 40 -86 L 46 0 Z" fill="' + L.top +
      '" stroke="' + INK + '" stroke-width="7"/>';
    if (!L.adult) {
      /* school tie */
      g += '<path d="M 0 -92 L -11 -78 L 0 -66 L 11 -78 Z" fill="#c92a2a" stroke="' + INK +
        '" stroke-width="5"/>' +
        '<path d="M 0 -66 L -8 -22 L 0 -12 L 8 -22 Z" fill="#c92a2a" stroke="' + INK +
        '" stroke-width="5"/>';
    } else {
      g += '<path d="M -30 -88 Q 0 -50 30 -88" fill="none" stroke="' + shade(L.top, -14) +
        '" stroke-width="10"/>';
    }
    /* Arms. Each one goes in its own group so it can hinge at the shoulder;
       the paths carry no transform attribute, so the class is safe on them. */
    var arm = '" fill="none" stroke="' + L.skin + '" stroke-width="17" stroke-linecap="round"/>';
    if (opts.point) {
      g += '<g class="jab"><path d="M 40 -80 L 118 -104' + arm +
        '<circle cx="124" cy="-106" r="12" fill="' + L.skin + '" stroke="' + INK +
        '" stroke-width="5"/></g>';
      g += '<g class="armld"><path d="M -40 -80 L -56 -18' + arm + '</g>';
    } else if (opts.up) {
      g += '<g class="armru"><path d="M 40 -80 L 66 -150' + arm + '</g>';
      g += '<g class="armld"><path d="M -40 -80 L -58 -20' + arm + '</g>';
    } else {
      g += '<g class="armrd"><path d="M 40 -80 L 54 -16' + arm + '</g>';
      g += '<g class="armld"><path d="M -40 -80 L -54 -16' + arm + '</g>';
    }
    /* Plaits hang from the head but stay outside the turning group: they are
       the one part whose bounding box would drag the pivot down to the hair
       tips, and a head that turns about its plaits looks like a puppet. */
    if (L.plait) {
      g += '<path d="M -40 ' + (headY - 2) + ' Q -62 ' + (headY + 40) + ' -50 ' + (headY + 74) +
        '" fill="none" stroke="' + L.hair + '" stroke-width="15" stroke-linecap="round"/>' +
        '<path d="M 40 ' + (headY - 2) + ' Q 62 ' + (headY + 40) + ' 50 ' + (headY + 74) +
        '" fill="none" stroke="' + L.hair + '" stroke-width="15" stroke-linecap="round"/>';
    }

    /* everything from here to the mouth turns together, on the neck */
    var h = '';
    /* head */
    h += '<circle cx="0" cy="' + headY + '" r="40" fill="' + L.skin + '" stroke="' + INK +
      '" stroke-width="7"/>';
    /* hair */
    h += '<path d="M -41 ' + (headY - 4) + ' Q -36 ' + (headY - 52) + ' 0 ' + (headY - 46) +
      ' Q 36 ' + (headY - 52) + ' 41 ' + (headY - 4) + ' Q 22 ' + (headY - 30) + ' 0 ' +
      (headY - 26) + ' Q -22 ' + (headY - 30) + ' -41 ' + (headY - 4) + ' Z" fill="' + L.hair +
      '" stroke="' + INK + '" stroke-width="5"/>';
    /* face */
    var ey = headY - 4;
    if (opts.shut) {
      h += '<path d="M -20 ' + ey + ' q 8 7 16 0" fill="none" stroke="' + INK + '" stroke-width="5"/>' +
        '<path d="M 4 ' + ey + ' q 8 7 16 0" fill="none" stroke="' + INK + '" stroke-width="5"/>';
    } else {
      /* open eyes blink. The lid class scales the pair down for one frame, so
         it goes on a group of its own - never on anything carrying a
         transform attribute. The offset keeps a room full of children from
         blinking in unison, which reads as a machine, not a class. */
      h += '<g class="lid" style="animation-delay:' + (x % 11 * 0.53).toFixed(2) + 's">' +
        '<circle cx="-13" cy="' + ey + '" r="5.5" fill="' + INK + '"/>' +
        '<circle cx="13" cy="' + ey + '" r="5.5" fill="' + INK + '"/></g>';
    }
    var my = headY + 18;
    if (opts.mouth === 'sad') {
      h += '<path d="M -13 ' + (my + 5) + ' q 13 -12 26 0" fill="none" stroke="' + INK +
        '" stroke-width="5" stroke-linecap="round" transform="translate(-13,0)"/>';
    } else if (opts.mouth === 'open') {
      /* an open mouth is a mouth in the middle of saying something, so it
         says something rather than hanging open for nineteen seconds */
      h += '<g class="talk" style="animation-delay:-' + (x % 9 * 0.31).toFixed(2) + 's">' +
        '<ellipse cx="0" cy="' + my + '" rx="11" ry="13" fill="#7a2b2b" stroke="' + INK +
        '" stroke-width="4"/></g>';
    } else if (opts.mouth === 'flat') {
      h += '<line x1="-12" y1="' + my + '" x2="12" y2="' + my + '" stroke="' + INK +
        '" stroke-width="5" stroke-linecap="round"/>';
    } else {
      h += '<path d="M -13 ' + (my - 4) + ' q 13 14 26 0" fill="none" stroke="' + INK +
        '" stroke-width="5" stroke-linecap="round"/>';
    }
    g += '<g class="head" style="animation-delay:-' + (x % 17 * 0.4).toFixed(2) + 's">' +
      h + '</g>';

    /* Everyone breathes, and whoever has an idle loop starts it part-way
       through, at a slightly different speed. Identical loops running in step
       is most of what makes a drawn crowd look mechanical. The offsets come
       from x, so they are the same on every run and screenshots stay stable. */
    var off = (x % 13 * 0.41).toFixed(2), dur = (3.1 + (x % 7) * 0.24).toFixed(2);
    var inner = anim
      ? '<g class="' + anim + '" style="animation-delay:-' + off + 's;animation-duration:' +
        dur + 's">' + g + '</g>'
      : '<g class="breathe" style="animation-delay:-' + off + 's">' + g + '</g>';
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">' + inner + '</g>';
  }

  /* ---- dust hanging in the light. Positions come off a fixed stride rather
     than Math.random, so two runs of the same scene are identical and a
     screenshot means something. ---- */
  function motes(n, x, y, w, h, tone) {
    var out = '', i, px, py;
    for (i = 0; i < n; i++) {
      px = x + ((i * 137) % 100) / 100 * w;
      py = y + ((i * 71) % 100) / 100 * h;
      out += '<circle class="mote" cx="' + px.toFixed(0) + '" cy="' + py.toFixed(0) +
        '" r="' + (2.2 + (i % 4) * 0.9).toFixed(1) + '" fill="' + (tone || '#fff4d2') +
        '" opacity="0" style="animation-delay:-' + (i * 1.7).toFixed(1) +
        's;animation-duration:' + (11 + (i % 5) * 1.6).toFixed(1) + 's"/>';
    }
    return '<g>' + out + '</g>';
  }

  /* ---- a shaft of light falling into the room from off to one side ---- */
  function shaft(xTop, wTop, xBot, wBot, tone) {
    return '<polygon class="shimmer" points="' + xTop + ',0 ' + (xTop + wTop) + ',0 ' +
      (xBot + wBot) + ',720 ' + xBot + ',720" fill="' + (tone || '#fff2c0') + '" opacity=".14"/>';
  }

  /* ---- a school desk seen from the front ---- */
  function desk(x, y, s, tone) {
    tone = tone || '#b98a52';
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">' +
      '<rect x="-78" y="-14" width="156" height="20" rx="5" fill="' + tone + '" stroke="' + INK +
      '" stroke-width="7"/>' +
      '<rect x="-70" y="6" width="14" height="66" fill="' + shade(tone, -14) + '" stroke="' + INK +
      '" stroke-width="6"/>' +
      '<rect x="56" y="6" width="14" height="66" fill="' + shade(tone, -14) + '" stroke="' + INK +
      '" stroke-width="6"/></g>';
  }

  /* ---- the crow ---- */
  function crow(x, y, s, opts) {
    opts = opts || {};
    var g = '<ellipse cx="0" cy="0" rx="52" ry="34" fill="#15161f" stroke="' + INK +
      '" stroke-width="6"/>' +
      /* tail */
      '<path d="M 44 -6 L 104 -26 L 100 6 Z" fill="#15161f" stroke="' + INK + '" stroke-width="6"/>' +
      /* wing */
      '<g class="' + (opts.flap ? 'flap' : '') + '">' +
      '<path d="M 6 -12 Q -22 -40 -46 -10 Q -18 6 6 -12 Z" fill="#22232f" stroke="' + INK +
      '" stroke-width="5"/></g>' +
      /* legs */
      '<path d="M -12 30 L -14 54 M 12 30 L 16 54" stroke="' + INK +
      '" stroke-width="6" stroke-linecap="round"/>' +
      /* head, tilted the way a crow does when it is deciding. The peck
         class lives on an inner group; the rotate attribute stays outside. */
      '<g transform="rotate(' + (opts.tilt ? -18 : 0) + ',-46,-30)">' +
      '<g class="' + (opts.peck ? 'peck' : '') + '">' +
      '<circle cx="-46" cy="-30" r="27" fill="#15161f" stroke="' + INK + '" stroke-width="6"/>' +
      '<path d="M -70 -32 L -104 -24 L -70 -18 Z" fill="#6a6a72" stroke="' + INK +
      '" stroke-width="5"/>' +
      '<circle cx="-52" cy="-36" r="8" fill="#ffd43b" stroke="' + INK + '" stroke-width="4"/>' +
      '<circle cx="-52" cy="-36" r="3.4" fill="' + INK + '"/>' +
      (opts.foil
        ? '<g class="glint"><rect x="-126" y="-34" width="26" height="20" rx="4" fill="#dfe4ee" ' +
        'stroke="' + INK + '" stroke-width="4"/></g>'
        : '') +
      '</g></g>';
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">' +
      (opts.anim ? '<g class="' + opts.anim + '">' + g + '</g>' : g) + '</g>';
  }

  /* ---- the shiny things that keep disappearing ---- */
  function compass(x, y, s) {
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">' +
      '<path d="M 0 -46 L -26 40" stroke="#c8ccd6" stroke-width="13" stroke-linecap="round"/>' +
      '<path d="M 0 -46 L 26 40" stroke="#c8ccd6" stroke-width="13" stroke-linecap="round"/>' +
      '<circle cx="0" cy="-46" r="11" fill="#8f97a8" stroke="' + INK + '" stroke-width="5"/>' +
      '<path d="M 26 40 L 34 52" stroke="#5c6373" stroke-width="9" stroke-linecap="round"/></g>';
  }
  function whistle(x, y, s) {
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">' +
      '<rect x="-40" y="-20" width="66" height="40" rx="12" fill="#cfd4de" stroke="' + INK +
      '" stroke-width="6"/>' +
      '<path d="M 26 -8 L 54 -16 L 54 8 L 26 8 Z" fill="#aeb5c2" stroke="' + INK + '" stroke-width="6"/>' +
      '<circle cx="-40" cy="-16" r="10" fill="none" stroke="' + INK + '" stroke-width="6"/></g>';
  }
  function keyring(x, y, s) {
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">' +
      '<circle cx="-14" cy="-14" r="22" fill="none" stroke="#c8ccd6" stroke-width="9"/>' +
      '<path d="M 4 0 L 40 34 L 30 44 L 24 38 L 16 46 L 8 38" fill="#c8ccd6" stroke="' + INK +
      '" stroke-width="5" stroke-linejoin="round"/></g>';
  }
  function mirror(x, y, s) {
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">' +
      '<circle cx="0" cy="0" r="38" fill="#dbe6f2" stroke="' + INK + '" stroke-width="7"/>' +
      '<path d="M -20 12 Q -6 -22 20 -18" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/></g>';
  }
  function pen(x, y, s) {
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ') rotate(-24)">' +
      '<rect x="-10" y="-48" width="20" height="76" rx="6" fill="#cfd4de" stroke="' + INK +
      '" stroke-width="6"/>' +
      '<path d="M -10 28 L 0 52 L 10 28 Z" fill="#8f97a8" stroke="' + INK + '" stroke-width="5"/>' +
      '<rect x="-11" y="-48" width="22" height="14" rx="4" fill="#1c4f8c" stroke="' + INK +
      '" stroke-width="5"/></g>';
  }
  /* The animated class goes on an INNER group every time. Putting it on the
     group that carries the transform attribute is the trap in rule 1: the CSS
     transform replaces the attribute and the art lands at 0,0. */
  function foil(x, y, s, cls) {
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">' +
      '<g class="' + (cls || '') + '">' +
      '<path d="M -30 -18 L 26 -24 L 34 16 L -22 22 Z" fill="#e6ebf5" stroke="' + INK +
      '" stroke-width="5"/>' +
      '<path d="M -14 -20 L -6 20 M 6 -22 L 14 18" stroke="#a9b0be" stroke-width="4"/></g></g>';
  }

  /* a four-pointed comic sparkle */
  function spark(x, y, r, cls) {
    return '<g transform="translate(' + x + ',' + y + ')">' +
      '<g class="glint ' + (cls || '') + '">' +
      '<path d="M 0 ' + (-r) + ' L ' + (r * 0.26) + ' ' + (-r * 0.26) + ' L ' + r + ' 0 L ' +
      (r * 0.26) + ' ' + (r * 0.26) + ' L 0 ' + r + ' L ' + (-r * 0.26) + ' ' + (r * 0.26) +
      ' L ' + (-r) + ' 0 L ' + (-r * 0.26) + ' ' + (-r * 0.26) + ' Z" fill="#ffd43b" stroke="' +
      INK + '" stroke-width="3"/></g></g>';
  }

  /* a speech bubble with its tail on the left or the right */
  function bubble(x, y, w, h, side, lines, size, beat) {
    var s = '<g transform="translate(' + x + ',' + y + ')"><g class="pop ' + (beat || '') + '">' +
      '<rect x="' + (-w / 2) + '" y="' + (-h / 2) + '" width="' + w + '" height="' + h +
      '" rx="22" fill="#fdf7ea" stroke="' + INK + '" stroke-width="8"/>';
    var tx = side === 'left' ? -w / 2 + 34 : w / 2 - 34;
    var dir = side === 'left' ? -1 : 1;
    s += '<path d="M ' + tx + ' ' + (h / 2 - 4) + ' L ' + (tx + dir * 12) + ' ' + (h / 2 + 40) +
      ' L ' + (tx + dir * 46) + ' ' + (h / 2 - 4) + ' Z" fill="#fdf7ea" stroke="' + INK +
      '" stroke-width="8"/>';
    s += '<rect x="' + (-w / 2 + 6) + '" y="' + (h / 2 - 12) + '" width="' + (w - 12) +
      '" height="10" fill="#fdf7ea"/>';
    size = size || 30;
    lines.forEach(function (ln, i) {
      s += Tp(0, -h / 2 + 46 + i * (size + 10), ln, size, INK);
    });
    return s + '</g></g>';
  }

  /* the classroom window: the latch is bent outward in every scene but the
     first, because that is the point of the story */
  function windowFrame(x, y, s, opts) {
    opts = opts || {};
    var g = '<rect x="-150" y="-116" width="300" height="232" rx="8" fill="#8fc3e8" stroke="' +
      INK + '" stroke-width="9"/>' +
      '<path d="M -150 40 L 150 -10" fill="none" stroke="#b9dcf3" stroke-width="16" opacity=".55"/>' +
      '<line x1="0" y1="-116" x2="0" y2="116" stroke="' + INK + '" stroke-width="9"/>' +
      '<line x1="-150" y1="0" x2="150" y2="0" stroke="' + INK + '" stroke-width="9"/>' +
      /* sill */

  };

  /* 18. the line. Two ways of looking, side by side. */
  S.finale = function (u) {
    return '<rect width="' + W + '" height="' + H + '" fill="#12142a"/>' +
      /* left panel: the whole class, aimed at one boy */
      '<g><rect x="60" y="70" width="520" height="420" rx="14" fill="#2a2140" stroke="#ffd43b" ' +
      'stroke-width="8"/>' +

      kid('yash', 300, 400, 0.52, null, { mouth: 'flat' }) +
      kid('kid2', 430, 400, 0.52, null, { mouth: 'flat' }) +
      '<path d="M 170 300 L 470 220 M 300 300 L 480 230 M 430 300 L 490 240" stroke="#e03131" ' +
      'stroke-width="6" class="flow" fill="none"/>' +
      kid('imran', 500, 430, 0.5, null, { down: true, mouth: 'flat' }) +
      '</g>' +
      /* right panel: one girl, aimed at a window */
      '<g><rect x="700" y="70" width="520" height="420" rx="14" fill="#1d3350" stroke="#ffd43b" ' +
      'stroke-width="8"/>' +
      kid('tanvi', 800, 420, 0.62, null, { mouth: 'flat' }) +
      windowFrame(1080, 250, 0.62, { bent: true, feather: true }) +
      '<path d="M 850 300 L 1010 260" stroke="#4dabf7" stroke-width="7" class="flow" fill="none"/>' +
      '</g>' +
      '<g class="pop b0">' + T(320, 140, 'EVERYONE', 50, '#ff8787') + '</g>' +
      '<g class="pop b1">' + T(960, 140, 'ONE OF THEM', 50, '#74c0fc') + '</g>';
  };

  /* 19. the crow still comes, and it has a name now */
  S.crowend = function (u) {
    return room(u, 'warm', true) +
      windowFrame(470, 250, 1.3, { bent: true }) +
      /* foil laid out on the sill, on purpose this time */
      '<g class="pop b0">' + foil(360, 400, 0.85, 'glint') + '</g>' +
      '<g class="pop b0x1">' + foil(470, 404, 0.85, 'glint g2') + '</g>' +

      '<g class="pop b1">' + T(1040, 200, 'THEY NAMED IT', 34, '#3a3f66') + '</g>' +

  /* ------------------------------------------------------- caption track
     Times are the second each caption appears. They were written for a spoken
     reading of about 225 seconds; app.js scales them to the real length if a
     narration.mp3 is dropped in beside this file, and drives them off a plain
     clock if there is no audio at all. */
  var LINES = [
    ['room', 'Room 6B, Nandini Public School, twenty minutes past eleven on a Thursday.', 0.00],
    ['room', 'Miss Rao opened the cupboard, and stopped.', 5.60],

    ['cupboard', 'The steel compass was gone.', 9.10],
    ['cupboard', 'So was the silver whistle, and the little round mirror from the science box.', 11.70],

    ['accuse', '"It is Imran," he said. "He sits nearest the cupboard. He only joined in July."', 22.80],
    ['accuse', 'Twenty-six heads turned to the back of the room.', 29.00],

    ['imran', 'Imran did not say anything.', 32.60],
    ['imran', 'He was new, and he had already learned that saying anything only made it longer.', 35.20],

    ['lunch', 'At lunch he sat by himself, the way he had all week.', 41.00],
    ['lunch', 'Three tables away, Tanvi felt something go cold.', 45.30],
    ['lunch', 'Because she had thought it was him too. On Tuesday. Without checking.', 49.20],

    ['list', 'That evening she wrote down everything that had gone missing.', 54.60],
    ['list', 'A compass. A whistle. A key ring. A mirror. Miss Rao’s steel pen.', 58.90],
    ['list', 'Not one storybook. Not one pencil. Not one rupee from anybody’s bag.', 64.60],
    ['list', 'Every single thing on that list was shiny.', 69.70],

    ['window', 'The next morning she came in early and stood at the cupboard.', 73.40],
    ['window', 'The window beside it did not shut properly. The latch was bent outward.', 77.70],
    ['window', 'And on the sill, stuck in the paint, there was one black feather.', 82.80],

    ['calendar', 'She checked the dates. All four of them were Thursdays.', 87.80],
    ['calendar', 'Thursday was games. The room stood empty for forty minutes.', 92.40],

    ['memory', 'And then she remembered something from June.', 97.30],
    ['memory', 'A whistle had gone missing that month too, and turned up a week later on the roof.', 100.90],
    ['memory', 'Nobody had ever asked how it got up there.', 107.00],

    ['ask', 'On Thursday morning, Tanvi asked Miss Rao if she could miss games. Just once.', 110.70],
    ['ask', 'Miss Rao looked at her for a moment, and said yes.', 116.50],

    ['wait', 'So Tanvi sat alone in an empty classroom with her hands in her lap,', 120.70],
    ['wait', 'and did not move for nineteen minutes.', 125.60],

    ['crow', 'At twenty past eleven, the bent latch swung open.', 128.80],
    ['crow', 'Something black came in off the water tank and hopped along the sill,', 133.00],
    ['crow', 'put its head on one side, and looked at the room with a bright yellow eye.', 138.10],

    ['steal', 'It took the silver foil off somebody’s leftover chocolate,', 143.80],
    ['steal', 'and went straight back out of the window.', 148.00],

    ['ledge', 'Tanvi stood on her chair to see where it went.', 151.40],
    ['ledge', 'Three metres up, on the ledge under the water tank.', 154.90],
    ['ledge', 'The wall below it was wet and green, with nothing to hold on to.', 159.10],
    ['ledge', 'She got down off the chair and went to find Miss Rao.', 164.20],

    ['ladder', 'Ramesh the gardener brought the long ladder.', 168.40],
    ['ladder', 'On the ledge, in a nest of wire and string, they found the compass, the whistle,', 172.00],
    ['ladder', 'two keys, a round mirror, and one steel pen with Miss Rao’s name on it.', 178.10],
    ['ladder', 'And about forty pieces of silver foil.', 183.90],

    ['sorry', 'Before assembly on Monday, Tanvi found Imran at the water cooler.', 187.50],
    ['sorry', '"I thought it was you as well," she said. "On Tuesday. I am sorry."', 192.20],
    ['sorry', 'Imran shrugged, and moved over so she could fill her bottle.', 197.80],

    ['assembly', 'In assembly, Miss Rao asked her how she had worked it out.', 202.40],
    ['assembly', 'Tanvi stood up. She did not say anything clever.', 207.00],

    ['finale', '"Everyone was looking at Imran.', 211.20],
    ['finale', 'I was the only one looking at the window."', 214.10],

    ['crowend', 'The crow still comes. 6B leave the foil out for it now, on the sill.', 218.40],
    ['crowend', 'They named it Thursday.', 224.00]
  ];

  var RUNTIME = 228;   /* seconds the story lasts when there is no audio file */

  /* ------------------------------------------------------------ the shots
     One entry per caption line of each scene: where the camera is standing
     while that sentence is spoken. z is how far in, (x,y) is what sits in the
     middle of the frame, and an optional `to` is where it has drifted to by
     the end of the line. Between one line and the next the camera CUTS.

     This is what stopped the story looking like a slideshow. Nineteen
     drawings held for eight to nineteen seconds each is a slideshow however
     prettily the camera drifts across them; the same nineteen drawings cut
     into forty-eight shots is a film. It also means the artwork can be read
     close up - the wide shot of the classroom and the shot of the single bent
     latch are the same drawing.

     Framings are clamped in frame() so the edge of the picture can never walk
     into shot, which is also why nothing has to be positioned defensively. */
  var SHOTS = {
    room: [
      { z: 1.06, x: 640, y: 340, to: { z: 1.14 } },          /* the room, Thursday */
      { z: 1.9, x: 420, y: 230 }                             /* the board: 6 B */
    ],
    cupboard: [
      { z: 2.2, x: 660, y: 190 },                            /* the gap on the shelf */
      { z: 2.2, x: 610, y: 340 },                            /* and the second gap */
      { z: 1.08, x: 700, y: 300 }                            /* out: four Thursdays */
    ],
    accuse: [
      { z: 1.9, x: 300, y: 400 },                            /* Yash, not waiting */
      { z: 1.45, x: 620, y: 290 },                           /* what he says */
      { z: 1.7, x: 1050, y: 420 }                            /* every head turns */
    ],
    imran: [
      { z: 1.9, x: 900, y: 400 },                            /* he says nothing */
      { z: 1.1, x: 640, y: 380 }                             /* out: the whole room */
    ],
    lunch: [
      { z: 1.8, x: 990, y: 380 },                            /* him, by himself */
      { z: 1.8, x: 300, y: 380 },                            /* her, three tables away */
      { z: 1.45, x: 340, y: 300 }                            /* she thought so too */
    ],
    list: [
      { z: 1.1, x: 640, y: 300 },                            /* the page */
      { z: 1.7, x: 400, y: 250, to: { x: 900 } },            /* along the five things */
      { z: 1.6, x: 640, y: 380 },                            /* and not one book */
      { z: 1.06, x: 640, y: 300, to: { z: 1.12 } }           /* every one of them shiny */
    ],
    window: [
      { z: 1.08, x: 640, y: 320 },                           /* early, at the cupboard */
      { z: 2.3, x: 545, y: 300 },                            /* the bent latch */
      { z: 2.2, x: 390, y: 400 }                             /* one black feather */
    ],
    calendar: [
      /* the whole page first - a column only means something once you can see
         the five columns it is not */
      { z: 1.15, x: 640, y: 300, to: { z: 1.24, x: 660, y: 322 } },
      { z: 1.6, x: 640, y: 430 }                             /* Thursday is games */
    ],
    memory: [
      { z: 1.7, x: 420, y: 240 },                            /* June */
      { z: 1.8, x: 620, y: 250 },                            /* the whistle, on the roof */
      { z: 1.06, x: 640, y: 340 }                            /* and nobody asked how */
    ],
    ask: [
      { z: 1.5, x: 450, y: 320 },                            /* may I stay back */

    ],
    wait: [
      { z: 1.08, x: 640, y: 360 },                           /* an empty room */
      { z: 2.0, x: 1050, y: 250, to: { z: 2.2 } }            /* in on the clock */
    ],
    crow: [
      { z: 2.4, x: 700, y: 290 },                            /* the latch swings */
      { z: 1.8, x: 620, y: 360 },                            /* something black */
      { z: 2.8, x: 560, y: 350 }                             /* one bright yellow eye */
    ],
    steal: [
      { z: 1.9, x: 360, y: 430 },                            /* it takes the foil */
      { z: 1.15, x: 700, y: 330 }                            /* and out of the window */
    ],
    ledge: [
      { z: 1.08, x: 640, y: 380 },                           /* she stands on the chair */
      { z: 1.5, x: 700, y: 240 },                            /* up under the water tank */
      { z: 1.6, x: 640, y: 470 },                            /* the wet green wall */
      { z: 1.06, x: 640, y: 360 }                            /* she goes to find Miss Rao */
    ],
    ladder: [
      { z: 1.4, x: 560, y: 450 },                            /* the long ladder */
      { z: 2.0, x: 820, y: 300 },                            /* the nest */
      { z: 2.4, x: 850, y: 290 },                            /* and what is in it */
      { z: 1.06, x: 640, y: 360 }                            /* forty pieces of foil */
    ],
    sorry: [
      { z: 1.12, x: 640, y: 380 },                           /* the water cooler */
      { z: 1.5, x: 400, y: 300 },                            /* I thought it was you too */
      { z: 1.8, x: 700, y: 420 }                             /* he moves over */
    ],
    assembly: [
      { z: 1.08, x: 640, y: 380 },                           /* assembly */
      { z: 1.7, x: 640, y: 360 }                             /* she stands up */
    ],
    finale: [
      { z: 1.9, x: 320, y: 280 },                            /* everyone, looking at him */
      { z: 1.9, x: 960, y: 280 }                             /* one of them, at the window */
    ],
    crowend: [
      { z: 1.7, x: 470, y: 380 },                            /* the foil left out on purpose */
      { z: 1.06, x: 640, y: 320, to: { z: 1.13 } }           /* they named it Thursday */
    ]
  };

  /* Where the camera stands, as a CSS transform on the <svg>. The framing is
     clamped so that the visible rectangle always lies inside the 1280x720
     picture - which is why no shot can ever show the edge of the drawing, and
     why a framing can be written down as "what I want in the middle" without
     also having to work out whether it fits. */
  function frame(z, cx, cy) {
    z = Math.max(1.02, z);
    var hw = 640 / z, hh = 360 / z;
    cx = Math.min(1280 - hw, Math.max(hw, cx));
    cy = Math.min(720 - hh, Math.max(hh, cy));
    return 'scale(' + z.toFixed(3) + ') translate(' +
      (-(cx - 640) / 1280 * 100).toFixed(3) + '%,' +
      (-(cy - 360) / 720 * 100).toFixed(3) + '%)';
  }

  /* One @keyframes per scene. Each shot drifts a little across its own line
     and then the camera cuts: the outgoing framing is held to within a
     hundredth of a percent of the next line's start, so the change happens
     inside a millisecond and reads as a cut rather than a swoop. */
  function cameraCSS(duration) {
    var t = timing(duration), out = [], i, j;
    for (i = 0; i < t.length; i++) {
      var sc = t[i], shots = SHOTS[sc.scene] || [{ z: 1.1, x: 640, y: 360 }];
      var keys = [];
      for (j = 0; j < sc.beats.length; j++) {
        var sh = shots[Math.min(j, shots.length - 1)];
        var to = sh.to || {};
        var from = sc.beats[j];
        var till = (j + 1 < sc.beats.length) ? sc.beats[j + 1] : sc.hold;
        var p0 = from / sc.hold * 100;
        var p1 = till / sc.hold * 100;
        keys.push(p0.toFixed(3) + '%{transform:' + frame(sh.z, sh.x, sh.y) + '}');
        keys.push(Math.max(p0, p1 - 0.01).toFixed(3) + '%{transform:' +
          frame(to.z || sh.z * 1.05, to.x || sh.x, to.y || sh.y) + '}');
      }
      out.push('@keyframes cam_' + sc.scene + '{' + keys.join('') + '}');
    }
    return out.join('\n');
  }

  /* Where each scene starts, how long it holds, and the second every caption
     line inside it lands. All of it comes out of LINES, so retiming the story
     retimes the artwork with it and there is no second list to keep in step. */
  function timing(duration) {
    var k = (duration && duration > 1) ? duration / RUNTIME : 1;
    var last = (duration && duration > 1) ? duration : RUNTIME;
    var out = [], seen = {}, i, key, at;
    for (i = 0; i < LINES.length; i++) {
      key = LINES[i][0]; at = LINES[i][2] * k;
      if (!seen[key]) { seen[key] = { scene: key, at: at, beats: [] }; out.push(seen[key]); }
      seen[key].beats.push(at - seen[key].at);
    }
    for (i = 0; i < out.length; i++) {
      out[i].hold = (i + 1 < out.length ? out[i + 1].at : last) - out[i].at;
    }
    return out;
  }

  /* The beat delays, as a stylesheet. b0 is the second the scene opens, b1 the
     next caption line of that scene, and bNxM four steps in between - so a
     label can be hung on a sentence instead of on a stopwatch. --tin is how
     far into the scene we already are, as a negative number, so a scene
     entered by dragging the bar shows what it should already have revealed
     rather than playing the whole reveal again. */
  function beatCSS(duration) {
    var t = timing(duration), css = [], i, j, m, sel, b, next, step;
    for (i = 0; i < t.length; i++) {
      sel = '.scene[data-scene="' + t[i].scene + '"].live ';
      for (j = 0; j < t[i].beats.length; j++) {
        b = t[i].beats[j];
        next = (j + 1 < t[i].beats.length) ? t[i].beats[j + 1] : t[i].hold;
        step = (next - b) / 5;
        css.push(sel + '.b' + j + '{animation-delay:calc(' + b.toFixed(2) + 's + var(--tin,0s))}');
        for (m = 1; m <= 4; m++) {
          css.push(sel + '.b' + j + 'x' + m + '{animation-delay:calc(' +
            (b + step * m).toFixed(2) + 's + var(--tin,0s))}');
        }
      }
    }
    return css.join('\n');
  }

  /* the one stylesheet app.js rewrites whenever the length of the story
     changes: the camera moves and the beat delays, which both come out of the
     same caption track */
  function timingCSS(duration) {
    return cameraCSS(duration) + '\n' + beatCSS(duration);
  }

  /* build the stage markup once; scene svgs are reused across repeated lines */
  function build() {
    var t = timing(0), i, k;
    var html = '<style>' + CSS + '</style>' + '<style id="beats">' + timingCSS(0) + '</style>';
    for (i = 0; i < t.length; i++) {
      k = t[i].scene;
      html += '<svg class="scene" data-scene="' + k + '" viewBox="0 0 ' + W + ' ' + H +
        '" preserveAspectRatio="xMidYMid slice" style="--cam:cam_' + k +
        ';--hold:' + t[i].hold.toFixed(2) + 's">' + S[k](i) + '</svg>';
    }
    return html;
  }

  /* If a narration.mp3 is added later, its real duration is passed in here and
     every caption time scales to it, so a fresh recording still lines up
     roughly. Re-measure the pauses for a tight fit. */
  function track(duration) {
    var k = (duration && duration > 1) ? duration / RUNTIME : 1;
    return LINES.map(function (l) {
      return { at: l[2] * k, scene: l[0], text: l[1] };
    });
  }

  window.STORY = {
    build: build, track: track, timing: timing,
    timingCSS: timingCSS, shots: SHOTS, frame: frame,
    lines: LINES, runtime: RUNTIME
  };
})();

</script>
<script>
/* app.js - The Thursday Thief (Class 6, AI Unit 1: What is Intelligence?).
   Screens: welcome -> story -> [part intro -> questions] x3 -> result.
   The story only tells the story. All of the teaching happens here, in three
   parts: Drag & Drop (complete the pattern), Multiple Choice, Guessing Game.
   Nothing leaves the browser. */
(function () {
  'use strict';

  var app = document.getElementById('app');
  var audio = document.getElementById('narration');

  /* ------------------------------------------------------------- the parts */
  var PARTS = [
    {
      key: 'drag', n: 'Part 1', title: 'Drag &amp; Drop',
      blurb: 'Every smart move in this story follows the same three steps. Drag the ' +
        'missing pieces into the empty boxes to complete it.'
    },
    {
      key: 'mcq', n: 'Part 2', title: 'Multiple Choice',
      blurb: 'Four answers, one is best. Tap the one you think is right.'
    },
    {
      key: 'guess', n: 'Part 3', title: 'Guessing Game',
      blurb: 'Read the clue and work out the word. Stuck? Ask for another clue — ' +
        'it costs you nothing.'
    }
  ];

  /* The three steps are deliberately identical every time: the situation you
     are in, the thinking you do about it, and the action that follows.
     Repeating it is what teaches it. */
  var SLOT_LABEL = {
    sit: 'THE SITUATION',
    skill: 'THE THINKING SKILL',
    act: 'THE SMART ACTION'
  };

  var QUESTIONS = [
    /* ------------------------------------------------------ part 1: drag
       Four different thinking skills from Unit 1 - comparing, patterns,
       memory, and safe decisions - poured into one unchanging shape. Every
       tray carries two decoys: one thing that is not a thinking skill at all,
       and one guess made without checking. */
    {
      part: 'drag', hero: 'TANVI &middot; THE LIST',
      q: 'Tanvi wrote down all five missing things and read the list again.',
      slots: [
        { role: 'sit', answer: 'shiny' },
        { role: 'skill', fixed: 'FINDING WHAT THEY ALL HAD IN COMMON' },
        { role: 'act', answer: 'window' }
      ],
      tray: [
        { id: 'shiny', t: 'every missing thing was small and shiny' },
        { id: 'window', t: 'she stopped looking at people and looked at the window' },
        { id: 'new', t: 'Imran was new, so it was probably him' },
        { id: 'box', t: 'the red pencil box still sitting on the shelf' }
      ]
    },
    {
      part: 'drag', hero: 'TANVI &middot; THE DATES',
      q: 'Tanvi checked the date of every single thing that had gone missing.',
      slots: [
        { role: 'sit', answer: 'thurs' },
        { role: 'skill', fixed: 'SPOTTING THE DAY THAT KEPT REPEATING' },
        { role: 'act', answer: 'stay' }
      ],
      tray: [
        { id: 'thurs', t: 'all four of them happened on a Thursday' },
        { id: 'stay', t: 'she asked to stay back in the room next Thursday' },
        { id: 'lucky', t: 'she hoped she would be lucky and pick the right day' },
        { id: 'clock', t: 'the clock on the classroom wall' }
      ]
    },
    {
      part: 'drag', hero: 'TANVI &middot; JUNE',
      q: 'Something about a missing whistle felt familiar to Tanvi.',
      slots: [
        { role: 'sit', fixed: 'a whistle went missing in June and turned up on the roof' },
        { role: 'skill', answer: 'remem' },
        { role: 'act', answer: 'up' }
      ],
      tray: [
        { id: 'remem', t: 'using something she had learned before' },
        { id: 'up', t: 'she looked upward, at the ledge under the water tank' },
        { id: 'sure', t: 'she felt sure about it without checking anything' },
        { id: 'ladder', t: 'the long ladder in the garden shed' }
      ]
    },
    {
      part: 'drag', hero: 'TANVI &middot; THE WET WALL',
      q: 'The nest was three metres up, and the wall below it was wet and green.',
      slots: [
        { role: 'sit', answer: 'wet' },
        { role: 'skill', fixed: 'THINKING ABOUT WHAT IS SAFE' },
        { role: 'act', answer: 'tell' }
      ],
      tray: [
        { id: 'wet', t: 'the ledge was high up with nothing safe to hold on to' },
        { id: 'tell', t: 'she got down off the chair and went to find Miss Rao' },
        { id: 'climb', t: 'she climbed the wall quickly before anyone could see' },
        { id: 'tank', t: 'the water tank on top of the building' }
      ]
    },

    /* ------------------------------------------------------- part 2: mcq
       Three about the story, three about situations that never appear in it,
       so the second half is transfer rather than recall. */
    {
      part: 'mcq',
      q: 'Not one person had seen Imran take anything. So why did the class decide it was him?',
      opts: [
        'Somebody had watched him open the cupboard',
        'He sat nearest the cupboard and he was new, so they decided it without checking',
        'Miss Rao told them it was him',
        'He said that he had done it'
      ], ans: 1,
      why: 'They started from what they thought, not from what anybody had actually noticed. That is a guess wearing the clothes of an answer.'
    },
    {
      part: 'mcq',
      q: 'Tanvi chose to stay back on a Thursday, not on a Monday. What made that a smart choice rather than a lucky one?',
      opts: [
        'Thursday is her favourite day of the week',
        'She had a strong feeling about Thursday',
        'All four of the thefts had already happened on Thursdays',
        'Games period is the nicest lesson to miss'
      ], ans: 2,
      why: 'A smart guess is built on something real. Four Thursdays in a row is a real clue. A feeling is not.'
    },
    {
      part: 'mcq',
      q: 'Tanvi could see the nest from her chair. Why was going to find Miss Rao the intelligent thing to do?',
      opts: [
        'Because teachers like being told things',

    return QUESTIONS.filter(function (q) { return q.part === key; });
  }
  function gapCount(q) {
    return q.slots.filter(function (s) { return s.answer; }).length;

    return n + (q.part === 'drag' ? gapCount(q) : 1);

      return q.part === 'drag' ? {}
        : q.part === 'guess' ? { tries: [], clues: 1, solved: false }
          : null;
    }),
    startedAt: null, finishedAt: null,
    picked: null
  };

  var SAVE_KEY = 'thursday-thief-class6-v1';
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { } }
  function restore() {
    try {
      var o = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (o && o.answers && o.answers.length === QUESTIONS.length && o.name) {

        S.picked = null;
        if (S.screen === 'story') S.screen = 'welcome';
      }
    } catch (e) { }
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function go(screen) { S.screen = screen; save(); render(); window.scrollTo(0, 0); }

  /* index helpers: questions are stored flat but shown part by part */
  function partQs() { return inPart(PARTS[S.part].key); }
  function absIndex(local) { return QUESTIONS.indexOf(partQs()[local]); }

  /* ------------------------------------------------------- the story clock
     The story runs off narration.mp3 when a readable one is sitting beside
     this file, and off a plain clock when there is not — so the folder works
     either way and a voiceover can be dropped in later without touching a
     line of this. Which one is in charge is settled at the first press of
     Play and then left alone, so the timing never changes mid-story. */
  var media = (function () {
    var useAudio = false, decided = false;
    var playing = false, clockAt = 0, stamp = 0, endedCb = null;

    function audible() { return !audio.error && audio.readyState >= 2; }
    function decide() {
      if (!decided) { useAudio = audible(); decided = true; }
      return useAudio;
    }
    function duration() {
      return (useAudio && audio.duration > 1) ? audio.duration : window.STORY.runtime;
    }
    function time() {
      if (useAudio) return audio.currentTime;
      if (!playing) return clockAt;
      return Math.min(duration(), clockAt + (Date.now() - stamp) / 1000);
    }

    audio.addEventListener('ended', function () { if (endedCb) endedCb(); });

    return {
      audible: audible,
      usingAudio: function () { return decided ? useAudio : audible(); },
      duration: duration,
      time: time,
      paused: function () { return useAudio ? audio.paused : !playing; },
      play: function () {
        decide();
        if (useAudio) return audio.play();
        clockAt = time(); stamp = Date.now(); playing = true;
        return Promise.resolve();
      },
      pause: function () {
        if (useAudio) { audio.pause(); return; }
        clockAt = time(); playing = false;
      },
      seek: function (t) {
        t = Math.max(0, Math.min(duration(), t));
        if (useAudio) { audio.currentTime = t; return; }
        clockAt = t; stamp = Date.now();
      },
      onended: function (fn) { endedCb = fn; },
      /* the clock has no 'ended' event of its own, so the frame loop asks */
      checkEnd: function () {
        if (useAudio || !playing) return;
        if (time() >= duration() - 0.02) {
          clockAt = duration(); playing = false;
          if (endedCb) endedCb();
        }
      }
    };
  })();

  var cues = null, tim = null, startOf = null, rafId = 0, liveScene = null, liveCue = -1;

  function mmss(t) {
    t = Math.max(0, Math.floor(t || 0));
    return Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2);
  }

  /* The caption track, the scene timing, and the stylesheet of beat delays
     all come from the same LINES, and all three are rebuilt here whenever the
     story screen is opened - because a narration.mp3 dropped in beside this
     file changes the length of everything at once. */
  function buildTiming() {
    var d = media.usingAudio() ? audio.duration : 0;
    cues = window.STORY.track(d);
    tim = window.STORY.timing(d);
    startOf = {};
    var st = document.getElementById('beats'), i, el;
    if (st) st.textContent = window.STORY.timingCSS(d);
    for (i = 0; i < tim.length; i++) {
      startOf[tim[i].scene] = tim[i].at;
      el = document.querySelector('#stage .scene[data-scene="' + tim[i].scene + '"]');
      if (el) el.style.setProperty('--hold', tim[i].hold.toFixed(2) + 's');
    }
  }

  /* tin is how far into this scene the story already is. It is zero when the
     scene arrives in its own time, and some way in when a child has dragged
     the bar - and passing it down as a negative delay is what makes a dragged
     scene look like it was always running instead of starting over. */
  function showScene(name, tin) {
    if (name === liveScene) return;
    liveScene = name;
    var all = document.querySelectorAll('#stage .scene'), i, el, on;
    for (i = 0; i < all.length; i++) {
      el = all[i];
      on = el.getAttribute('data-scene') === name;
      el.classList.remove('live');
      if (on) {
        el.style.setProperty('--tin', '-' + Math.max(0, tin || 0).toFixed(2) + 's');
        void el.getBoundingClientRect();   /* forces the camera move to restart */
        el.classList.add('live');
      }
    }
  }

  /* A caption arrives a word at a time, fast, the way a line is spoken. A
     whole sentence appearing at once is the single most mechanical thing a
     read-along does. textContent still reads back as the plain sentence. */
  function setCaption(text) {
    var cap = document.getElementById('cap');
    if (!cap) return;
    var words = String(text).split(' '), out = '', i;
    var step = Math.min(0.05, 0.5 / Math.max(1, words.length));
    for (i = 0; i < words.length; i++) {
      out += '<span class="w" style="animation-delay:' + (i * step).toFixed(3) + 's">' +
        esc(words[i]) + '</span>' + (i < words.length - 1 ? ' ' : '');
    }
    cap.innerHTML = out;
  }

  /* paint() does the work; loop() keeps it smooth while playing. timeupdate is
     wired to paint() too, so captions keep moving if frames are throttled. */
  function paint() {
    var t = media.time(), d = media.duration();
    if (!cues) buildTiming();
    var i, k = 0;
    for (i = 0; i < cues.length; i++) if (cues[i].at <= t + 0.02) k = i;
    if (k !== liveCue) {
      liveCue = k;
      showScene(cues[k].scene, t - (startOf[cues[k].scene] || 0));
      setCaption(cues[k].text);
    }
    var fill = document.getElementById('barfill');
    if (fill) fill.style.width = (t / d * 100).toFixed(2) + '%';
    var clock = document.getElementById('clock');
    if (clock) clock.textContent = mmss(t) + ' / ' + mmss(d);
  }

  function loop() {
    media.checkEnd();
    paint();
    if (!media.paused()) rafId = requestAnimationFrame(loop);
  }

  function wireStory() {
    cues = null; tim = null; liveScene = null; liveCue = -1;
    var play = document.getElementById('b-play');
    /* Pausing has to stop the pictures too. A paused story whose art keeps
       drifting under a frozen caption looks broken, not alive. */
    function sync() {
      play.textContent = media.paused() ? 'Play' : 'Pause';
      var stage = document.getElementById('stage');
      if (stage) stage.classList.toggle('playing', !media.paused());
    }

    /* tell the child whether to expect a voice or to read along */
    var mode = document.getElementById('mode');
    if (mode && !media.audible()) {
      mode.textContent = 'Read the words as they appear. There is no sound in this one.';
    }

    play.onclick = function () {
      var st = document.getElementById('stage');
      if (st) st.classList.add('started');
      if (media.paused()) {
        media.play().then(sync).catch(function () {
          document.getElementById('cap').textContent =
            'The sound could not be played. Keep narration.mp3 next to this page.';
        });
        cancelAnimationFrame(rafId); rafId = requestAnimationFrame(loop);
      } else { media.pause(); }
      sync();
    };
    document.getElementById('b-restart').onclick = function () {
      media.seek(0); liveCue = -1; liveScene = null; media.play();
      cancelAnimationFrame(rafId); rafId = requestAnimationFrame(loop);
      sync();
    };
    document.getElementById('bar').onclick = function (e) {
      var r = this.getBoundingClientRect();
      media.seek(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * media.duration());
      liveCue = -1; liveScene = null; paint();
    };
    document.getElementById('b-back').onclick = function () { media.pause(); go('welcome'); };
    document.getElementById('b-quiz').onclick = function () {
      media.pause(); S.part = 0; S.current = 0; go('intro');
    };

    media.onended(function () {
      S.watched = true; save();
      play.textContent = 'Play';
      var b = document.getElementById('b-quiz');
      if (b) { b.disabled = false; b.textContent = 'Go to the questions'; }
      setCaption('The end. Now the questions.');
      var stage = document.getElementById('stage');
      if (stage) stage.classList.remove('playing');
    });
    audio.onpause = sync;
    audio.onplay = sync;
    audio.ontimeupdate = paint;
    sync();
    paint();
  }

  function patternHTML(slots, placed, qi) {

  function dragBodyHTML(q, qi) {
    var placed = S.answers[qi] || {};        /* slotId -> tray item text */
    var usedIds = Object.keys(placed).map(function (k) { return placed[k].id; });
    var placedText = {};
    Object.keys(placed).forEach(function (k) { placedText[k] = placed[k].t; });

    var tray = q.tray.filter(function (it) { return usedIds.indexOf(it.id) < 0; });
    var s = patternHTML(q.slots, placedText, qi);

      'Two of these four cards do not belong anywhere — leave them where they are.</p>';

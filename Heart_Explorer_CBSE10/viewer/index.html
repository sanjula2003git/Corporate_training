<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#111f32;color:#eff5ff;font:14px system-ui}button{cursor:pointer;background:#20374f;color:#eff5ff;border:1px solid #456078;border-radius:11px;padding:10px 13px}button:hover,button.active{background:#8c3d58;border-color:#ef9fb5}button:focus-visible{outline:3px solid #ffc975}.toolbar{padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar label{display:flex;gap:8px;align-items:center}#stage{height:640px;position:relative;overflow:hidden;background:radial-gradient(ellipse,#28354d,#101e31 73%)}canvas{display:block;touch-action:none}#labels{position:absolute;inset:0;pointer-events:none}.tag{position:absolute;pointer-events:auto;background:#142237ec;border:1px solid #8d8092;font-size:12px;padding:6px 8px;max-width:160px}.tag.active{border-color:#ffc975}#leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#tip{position:absolute;bottom:12px;left:20%;right:20%;background:#071420eb;border:1px solid #d88ca5;padding:12px;border-radius:10px;display:none;pointer-events:none}#tip b{display:block;color:#f2adc0;margin-bottom:4px}#loading{position:absolute;top:45%;left:0;right:0;text-align:center}#phase{position:absolute;bottom:15px;left:15px;color:#f8d49d;background:#152035d9;padding:8px 12px;border-radius:12px;font-size:13px}#topics{display:flex;gap:6px;flex-wrap:wrap;padding:12px;border-top:1px solid #304255}#topics button{font-size:12px;padding:6px 10px}#selected{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 15px;min-height:56px}#description{font-size:13px;color:#bfcfe1}input[type=range]{width:105px;accent-color:#e97894}html:fullscreen body{height:100vh;display:flex;flex-direction:column}html:fullscreen #stage{flex:1;height:auto;min-height:200px}html:fullscreen #topics{max-height:95px;overflow:auto}#legend{padding:8px 15px;color:#b3c4da;font-size:12px}#ask{background:#ab4968}button:disabled{opacity:.5;cursor:default}@media(max-width:650px){#stage{hei

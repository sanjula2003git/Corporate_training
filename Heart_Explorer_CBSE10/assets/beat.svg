<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="490" viewBox="0 0 1050 490"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f5cd72"/></marker></defs><rect width="1050" height="490" rx="26" fill="#102139"/><rect x="35" y="150" width="300" height="95" rx="20" fill="#315a83"/><text x="185.0" y="204.5" fill="#eef4ff" font-size="22" text-anchor="middle" font-family="Arial,sans-serif">1 · Fill</text><text x="185" y="290" fill="#eef4ff" font-size="20" text-anchor="middle" font-family="Arial,sans-serif">Relaxed ventricles fill</text><path d="M340,195 L370,195" stroke="#88bfff" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="380" y="150" width="300" height="95" rx="20" fill="#315a83"/><text x="530.0" y="204.5" fill="#eef4ff" font-size="22" text-anchor="middle" font-family="Arial,sans-serif">2 · Atria contract</text><text x="530" y="290" fill="#eef4ff" font-size="20" text-anchor="middle" font-family="Arial,sans-serif">Filling is completed</text><path d="M685,195 L715,195" stroke="#88bfff" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="725" y="150" width="300" height="95" rx="20" fill="#315a83"/><text x="875.0" y="204.5" fill="#eef4ff" font-size="22" text-anchor="middle" font-family="Arial,sans-serif">3 · Ventricles contract</text><text x="875" y="290" fill="#eef4ff" font-size="20" text-anchor="middle" font-family="Arial,sans-serif">Blood is ejected</text><text x="525" y="385" fill="#f5cd72" font-size="26" text-anchor="middle" font-family="Arial,sans-serif">Ventricles relax → the cycle repeats</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc"><title id="title">Structure of an atom</title><desc id="desc">Helium-4 has two protons and two neutrons in its nucleus, with two electrons around it when neutral.</desc><defs><radialGradient id="p" cx="30%" cy="25%"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".38" stop-color="#f78679"/><stop offset="1" stop-color="#f78679" stop-opacity=".65"/></radialGradient><radialGradient id="n" cx="30%" cy="25%"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".38" stop-color="#e7bf6c"/><stop offset="1" stop-color="#e7bf6c" stop-opacity=".65"/></radialGradient><radialGradient id="e" cx="30%" cy="25%"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".38" stop-color="#6dcbff"/><stop offset="1" stop-color="#6dcbff" stop-opacity=".65"/></radialGradient><radialGradient id="bg"><stop stop-color="#213b50"/><stop offset="1" stop-color="#101e30"/></radialGradient></defs><rect width="1080" height="650" rx="24" fill="url(#bg)"/><text x="45" y="55" fill="#8ae0c9" font-size="19" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ATOMLAB / STRUCTURE OF AN ATOM</text><text x="45" y="90" fill="#9eb7cb" font-size="23" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">A tiny nucleus and the region around it.</text><circle cx="370" cy="285" r="119.00000000000001" fill="none" stroke="#395b72" stroke-width="2"/><circle cx="489.0" cy="285.0" r="10" fill="url(#e)"/><text x="489.0" y="288.4" fill="#102137" font-size="10" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">−</text><circle cx="251.0" cy="285.0" r="10" fill="url(#e)"/><text x="251.0" y="288.4" fill="#102137" font-size="10" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">−</text><circle cx="370.0" cy="285.0" r="11" fill="url(#p)"/><text x="370.0" y="288.74" fill="#102137" font-size="11" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">+</text><circle cx="364.10106642860706" cy="290.40394140607515" r="11" fill="url(#p)"/><text x="364.10106642860706" y="294.14394140607516" fill="#102137" font-size="11" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">+</text><circle cx="370.98903636414445" cy="273.7296048396518" r="11" fill="url(#n)"/><text x="370.98903636414445" y="277.4696048396518" fill="#102137" font-size="11" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">0</text><circle cx="378.43088271041535" cy="295.9963728894222" r="11" fill="url(#n)"/><text x="378.43088271041535" y="299.7363728894222" fill="#102137" font-size="11" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">0</text><path d="M318.2391014407636 177.84679482003145 L240 146" stroke="#8ae0c9" stroke-width="2" fill="none"/><text x="240" y="140" fill="#8ae0c9" font-size="16" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">K shell</text><path d="M370 320 L370 428.0" stroke="#9eb7cb" stroke-width="2" fill="none"/><text x="370" y="447.0" fill="#eaf4fc" font-size="17" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Nucleus</text><path d="M380 275 L655 225" stroke="#9eb7cb" stroke-width="2" fill="none"/><text x="680" y="220" fill="#eaf4fc" font-size="23" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Nucleus</text><text x="680" y="253" fill="#eaf4fc" font-size="23" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">2 protons + 2 neutrons</text><path d="M250 270 L190 405" stroke="#9eb7cb" stroke-width="2" fill="none"/><text x="70" y="444" fill="#6dcbff" font-size="24" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Electrons outside</text><text x="700" y="370" fill="#8ae0c9" font-size="30" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Helium-4</text><circle cx="75" cy="580" r="15" fill="url(#p)"/><text x="75" y="585.1" fill="#102137" font-size="15" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">+</text><text x="100" y="586" fill="#f78679" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Proton (+)</text><circle cx="320" cy="580" r="15" fill="url(#n)"/><text x="320" y="585.1" fill="#102137" font-size="15" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">0</text><text x="345" y="586" fill="#e7bf6c" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Neutron (0)</text><circle cx="590" cy="580" r="15" fill="url(#e)"/><text x="590" y="585.1" fill="#102137" font-size="15" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">−</text><text x="615" y="586" fill="#6dcbff" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Electron (−)</text><text x="75" y="626" fill="#9eb7cb" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Rings show electron shells; the central cluster is the nucleus.</text><text x="1030" y="635" fill="#9eb7cb" font-size="13" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">Illustrative • not to scale</text></svg>
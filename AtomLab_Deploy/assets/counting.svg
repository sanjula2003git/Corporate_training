<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc"><title id="title">Counting particles</title><desc id="desc">For ²³₁₁Na⁺: protons = 11; neutrons = 23 − 11 = 12; electrons = 11 − 1 = 10.</desc><defs><radialGradient id="p" cx="30%" cy="25%"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".38" stop-color="#f78679"/><stop offset="1" stop-color="#f78679" stop-opacity=".65"/></radialGradient><radialGradient id="n" cx="30%" cy="25%"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".38" stop-color="#e7bf6c"/><stop offset="1" stop-color="#e7bf6c" stop-opacity=".65"/></radialGradient><radialGradient id="e" cx="30%" cy="25%"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".38" stop-color="#6dcbff"/><stop offset="1" stop-color="#6dcbff" stop-opacity=".65"/></radialGradient><radialGradient id="bg"><stop stop-color="#213b50"/><stop offset="1" stop-color="#101e30"/></radialGradient></defs><rect width="1080" height="650" rx="24" fill="url(#bg)"/><text x="45" y="55" fill="#8ae0c9" font-size="19" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ATOMLAB / COUNTING PARTICLES</text><text x="45" y="90" fill="#9eb7cb" font-size="23" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Read the symbol, then work step by step.</text><text x="195" y="285" fill="#8ae0c9" font-size="43" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">23</text><text x="195" y="358" fill="#6dcbff" font-size="43" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">11</text><text x="275" y="342" fill="#eaf4fc" font-size="105" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Na</text><text x="425" y="270" fill="#f78679" font-size="45" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">+</text><path d="M235 269 L485 197" stroke="#8ae0c9" stroke-width="2" fill="none"/><text x="360" y="178" fill="#8ae0c9" font-size="19" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">A: mass number</text><path d="M234 350 L455 413" stroke="#6dcbff" stroke-width="2" fill="none"/><text x="310" y="440" fill="#6dcbff" font-size="19" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Z: atomic number</text><path d="M445 255 L500 153" stroke="#f78679" stroke-width="2" fill="none"/><text x="465" y="142" fill="#f78679" font-size="19" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Ion charge</text><text x="560" y="215" fill="#eaf4fc" font-size="23" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Protons = 11</text><text x="560" y="283" fill="#eaf4fc" font-size="23" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Neutrons = 23 − 11 = 12</text><text x="560" y="351" fill="#eaf4fc" font-size="23" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Electrons = 11 − 1 = 10</text><text x="540" y="482" fill="#8ae0c9" font-size="24" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Read A and Z first. Then account for charge.</text><circle cx="75" cy="580" r="15" fill="url(#p)"/><text x="75" y="585.1" fill="#102137" font-size="15" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">+</text><text x="100" y="586" fill="#f78679" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Proton (+)</text><circle cx="320" cy="580" r="15" fill="url(#n)"/><text x="320" y="585.1" fill="#102137" font-size="15" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">0</text><text x="345" y="586" fill="#e7bf6c" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Neutron (0)</text><circle cx="590" cy="580" r="15" fill="url(#e)"/><text x="590" y="585.1" fill="#102137" font-size="15" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">−</text><text x="615" y="586" fill="#6dcbff" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Electron (−)</text><text x="75" y="626" fill="#9eb7cb" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Rings show electron shells; the central cluster is the nucleus.</text><text x="1030" y="635" fill="#9eb7cb" font-size="13" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">Illustrative • not to scale</text></svg>
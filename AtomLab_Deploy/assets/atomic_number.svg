en if neutrons</text><text x="545" y="412" fill="#eaf4fc" font-size="23" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">or electrons change.</text><circle cx="75" cy="580" r="15" fill="url(#p)"/><text x="75" y="585.1" fill="#102137" font-size="15" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">+</text><text x="100" y="586" fill="#f78679" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Proton (+)</text><circle cx="320" cy="580" r="15" fill="url(#n)"/><text x="320" y="585.1" fill="#102137" font-size="15" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">0</text><text x="345" y="586" fill="#e7bf6c" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Neutron (0)</text><circle cx="590" cy="580" r="15" fill="url(#e)"/><text x="590" y="585.1" fill="#102137" font-size="15" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">−</text><text x="615" y="586" fill="#6dcbff" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Electron (−)</text><text x="75" y="626" fill="#9eb7cb" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Rings show electron shells; the central cluster is the nucleus.</text><text x="1030" y="635" fill="#9eb7cb" font-size="13" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">Illustrative • not to scale</text></svg>
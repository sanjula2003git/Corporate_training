<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc"><title id="title">Neutrons</title><desc id="desc">Hydrogen-1 has 1 proton and 0 neutrons. Hydrogen-2 has 1 proton and 1 neutron. Both are hydrogen.</desc><defs><radialGradient id="p" cx="30%" cy="25%"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".38" stop-color="#f78679"/><stop offset="1" stop-color="#f78679" stop-opacity=".65"/></radialGradient><radialGradient id="n" cx="30%" cy="25%"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".38" stop-color="#e7bf6c"/><stop offset="1" stop-color="#e7bf6c" stop-opacity=".65"/></radialGradient><radialGradient id="e" cx="30%" cy="25%"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".38" stop-color="#6dcbff"/><stop offset="1" stop-color="#6dcbff" stop-opacity=".65"/></radialGradient><radialGradient id="bg"><stop stop-color="#213b50"/><stop offset="1" stop-color="#101e30"/></radialGradient></defs><rect width="1080" height="650" rx="24" fill="url(#bg)"/><text x="45" y="55" fill="#8ae0c9" font-size="19" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ATOMLAB / NEUTRONS</text><text x="45" y="90" fill="#9eb7cb" font-size="23" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">No electric charge, but an important role.</text><path d="M290 420 L290 451" stroke="#e7bf6c" stroke-width="2" fill="none"/><text x="290" y="480" fill="#e7bf6c" font-size="24" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Neutron</text><circle cx="290" cy="300" r="120" fill="url(#n)"/><text x="290" y="340.8" fill="#102137" font-size="120" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">0</text><text x="515" y="228" fill="#e7bf6c" font-size="23" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">NEUTRON</text><text x="515" y="276" fill="#e7bf6c" font-size="23" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Charge: 0</text><text x="515" y="324" fill="#e7bf6c" font-size="23" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Approximate mass: 1 u</text><text x="515" y="372" fill="#e7bf6c" font-size="23" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Location: nucleus</text><text x="515" y="420" fill="#e7bf6c" font-size="23" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Distinguishes isotopes</text><circle cx="75" cy="580" r="15" fill="url(#p)"/><text x="75" y="585.1" fill="#102137" font-size="15" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">+</text><text x="100" y="586" fill="#f78679" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Proton (+)</text><circle cx="320" cy="580" r="15" fill="url(#n)"/><text x="320" y="585.1" fill="#102137" font-size="15" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">0</text><text x="345" y="586" fill="#e7bf6c" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Neutron (0)</text><circle cx="590" cy="580" r="15" fill="url(#e)"/><text x="590" y="585.1" fill="#102137" font-size="15" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">−</text><text x="615" y="586" fill="#6dcbff" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Electron (−)</text><text x="75" y="626" fill="#9eb7cb" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Rings show electron shells; the central cluster is the nucleus.</text><text x="1030" y="635" fill="#9eb7cb" font-size="13" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">Illustrative • not to scale</text></svg>
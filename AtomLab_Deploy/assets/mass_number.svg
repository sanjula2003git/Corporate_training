<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc"><title id="title">Mass number</title><desc id="desc">Sodium-23 has Z = 11. Its neutron count is 23 − 11 = 12. Losing an electron does not change A.</desc><defs><radialGradient id="p" cx="30%" cy="25%"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".38" stop-color="#f78679"/><stop offset="1" stop-color="#f78679" stop-opacity=".65"/></radialGradient><radialGradient id="n" cx="30%" cy="25%"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".38" stop-color="#e7bf6c"/><stop offset="1" stop-color="#e7bf6c" stop-opacity=".65"/></radialGradient><radialGradient id="e" cx="30%" cy="25%"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".38" stop-color="#6dcbff"/><stop offset="1" stop-color="#6dcbff" stop-opacity=".65"/></radialGradient><radialGradient id="bg"><stop stop-color="#213b50"/><stop offset="1" stop-color="#101e30"/></radialGradient></defs><rect width="1080" height="650" rx="24" fill="url(#bg)"/><text x="45" y="55" fill="#8ae0c9" font-size="19" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ATOMLAB / MASS NUMBER</text><text x="45" y="90" fill="#9eb7cb" font-size="23" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Count the particles in the nucleus.</text><circle cx="195" cy="250" r="55" fill="url(#p)"/><text x="195" y="268.7" fill="#102137" font-size="55" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">+</text><text x="195" y="350" fill="#f78679" font-size="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">8 protons</text><text x="350" y="263" fill="#eaf4fc" font-size="44" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">+</text><circle cx="520" cy="250" r="55" fill="url(#n)"/><text x="520" y="268.7" fill="#102137" font-size="55" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">0</text><text x="520" y="350" fill="#e7bf6c" font-size="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">10 neutrons</text><text x="665" y="263" fill="#eaf4fc" font-size="44" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">=</text><text x="825" y="280" fill="#8ae0c9" font-size="90" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">18</text><text x="825" y="350" fill="#eaf4fc" font-size="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Mass number A</text><text x="540" y="475" fill="#eaf4fc" font-size="30" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">A = Z + N       N = A − Z</text><circle cx="75" cy="580" r="15" fill="url(#p)"/><text x="75" y="585.1" fill="#102137" font-size="15" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">+</text><text x="100" y="586" fill="#f78679" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Proton (+)</text><circle cx="320" cy="580" r="15" fill="url(#n)"/><text x="320" y="585.1" fill="#102137" font-size="15" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">0</text><text x="345" y="586" fill="#e7bf6c" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Neutron (0)</text><circle cx="590" cy="580" r="15" fill="url(#e)"/><text x="590" y="585.1" fill="#102137" font-size="15" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">−</text><text x="615" y="586" fill="#6dcbff" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Electron (−)</text><text x="75" y="626" fill="#9eb7cb" font-size="18" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Rings show electron shells; the central cluster is the nucleus.</text><text x="1030" y="635" fill="#9eb7cb" font-size="13" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">Illustrative • not to scale</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc"><title id="title">What is an atom?</title><desc id="desc">In H₂O, the small 2 means two hydrogen atoms. There is one oxygen atom in each water molecule.</desc><defs><radialGradient id="p" cx="30%" cy="25%"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".38" stop-color="#f78679"/><stop offset="1" stop-color="#f78679" stop-opacity=".65"/></radialGradient><radialGradient id="n" cx="30%" cy="25%"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".38" stop-color="#e7bf6c"/><stop offset="1" stop-color="#e7bf6c" stop-opacity=".65"/></radialGradient><radialGradient id="e" cx="30%" cy="25%"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".38" stop-color="#6dcbff"/><stop offset="1" stop-color="#6dcbff" stop-opacity=".65"/></radialGradient><radialGradient id="bg"><stop stop-color="#213b50"/><stop offset="1" stop-color="#101e30"/></radialGradient></defs><rect width="1080" height="650" rx="24" fill="url(#bg)"/><text x="45" y="55" fill="#8ae0c9" font-size="19" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ATOMLAB / WHAT IS AN ATOM?</text><text x="45" y="90" fill="#9eb7cb" font-size="23" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Begin with the building blocks of matter.</text><circle cx="360" cy="275" r="69" fill="url(#e)"/><circle cx="515" cy="240" r="88" fill="url(#p)"/><circle cx="655" cy="310" r="69" fill="url(#e)"/><path d="M320 230 L235 185" stroke="#9eb7cb" stroke-width="2" fill="none"/><text x="120" y="174" fill="#6dcbff" font-size="21" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Hydrogen atom</text><path d="M550 182 L710 162" stroke="#9eb7cb" stroke-width="2" fill="none"/><text x="710" y="156" fill="#f78679" font-size="21" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Oxygen atom</text><path d="M690 345 L820 370" stroke="#9eb7cb" stroke-width="2" fill="none"/><text x="805" y="400" fill="#6dcbff" font-size="21" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Hydrogen atom</text><text x="360" y="285" fill="#eaf4fc" font-size="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">H</text><text x="515" y="252" fill="#eaf4fc" font-size="44" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">O</text><text x="655" y="320" fill="#eaf4fc" font-size="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">H</text><text x="540" y="425" fill="#eaf4fc" font-size="30" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">One water molecule · H₂O</text><text x="540" y="472" fill="#8ae0c9" font-size="23" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2 hydrogen atoms + 1 oxygen atom</text><text x="75" y="593" fill="#8ae0c9" font-size="22" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">H = hydrogen atom     O = oxygen atom     H₂O = water molecule</text><text x="1030" y="635" fill="#9eb7cb" font-size="13" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">Illustrative • not to scale</text></svg>